                  .map(([param,entry])=>(
                    <ParamField key={param} strategy={key} param={param}
                      entry={entry} onUpdate={updateParam}/>
                  ))}
                {Object.keys(params).filter(k=>k!=="enabled").length===0 && (
                  <div style={{fontSize:11,color:"#64748b"}}>No configurable params — toggle enabled above.</div>
                )}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function App() {
  const [data, setData]               = React.useState(null);
  const [wsOk, setWsOk]               = React.useState(false);
  const [tab, setTab]                 = React.useState("trading");
  const [logs, setLogs]               = React.useState([]);
  const [services, setServices]       = React.useState(null);
  const [backtest, setBacktest]       = React.useState(null);
  const [btStrat, setBtStrat]         = React.useState(null);
  const [paperStats, setPaperStats]   = React.useState(null);
  const [paperPos, setPaperPos]       = React.useState([]);

  /* system alerts */
  const [sysAlerts, setSysAlerts]     = React.useState([]);

  /* signal health */
  const [drought, setDrought]         = React.useState(null);

  /* learning — data pushed via WS when trades change */
  const [learnStats,   setLearnStats]   = React.useState(null);
  const [learnTrades,  setLearnTrades]  = React.useState([]);
  const [learnLtps,    setLearnLtps]    = React.useState({});

  /* commodity */
  const [commStats, setCommStats]     = React.useState(null);
  const [commTrades, setCommTrades]   = React.useState([]);
  const [commLtps,  setCommLtps]      = React.useState({});
  const [commMode,  setCommMode]      = React.useState("PAPER");
  const [commModeBusy, setCommModeBusy] = React.useState(false);

  /* strategy config */
  const [stratConfig, setStratConfig] = React.useState(null);
  const [mcxConfig,   setMcxConfig]   = React.useState(null);

  /* daily journal */
  const [journal, setJournal]         = React.useState(null);
  const [journalLoading, setJournalLoading] = React.useState(false);
  const [jFilter, setJFilter]         = React.useState("all");
  const [jDate,   setJDate]           = React.useState("");
  const [jExpanded, setJExpanded]     = React.useState({});

  const logRef = React.useRef(null);

  /* ── live WS ── */
  React.useEffect(() => {
    let ws;
    function connect() {
      ws = new WebSocket(WS);
      ws.onopen    = () => setWsOk(true);
      ws.onclose   = () => { setWsOk(false); setTimeout(connect, 3000); };
      ws.onerror   = () => setWsOk(false);
      ws.onmessage = e => {
        try {
          const d = JSON.parse(e.data);
          setData(d);
          if (Array.isArray(d.system_alerts)) setSysAlerts(d.system_alerts);
          // Learning trades+stats: only sent when changed (per-connection hash on server)
          if (d.learning) {
            setLearnTrades(d.learning.trades || []);
            setLearnStats(d.learning.stats   || null);
          }
          // Learning LTPs: sent every tick for open positions
          if (d.learning_ltps) setLearnLtps(d.learning_ltps);
          // Commodity spot LTPs: sent every tick for open MCX positions
          if (d.commodity_ltps) setCommLtps(d.commodity_ltps);
        } catch{}
      };
    }
    connect();
    return () => ws && ws.close();
  }, []);

  /* ── log WS ── */
  React.useEffect(() => {
    let ws;
    function connectLogs() {
      ws = new WebSocket(WS_LOGS);
      ws.onmessage = e => {
        setLogs(prev => [e.data, ...prev].slice(0, 200));
      };
      ws.onclose = () => setTimeout(connectLogs, 3000);
    }
    connectLogs();
    return () => ws && ws.close();
  }, []);

  /* ── polling fetches ── */
  React.useEffect(() => {
    const loadServices = () =>
      fetch(`${API}/services/status`).then(r=>r.json()).then(setServices).catch(()=>{});
    const loadBacktest = () =>
      fetch(`${API}/backtest/results`).then(r=>r.json()).then(d=>{
        setBacktest(d);
        if (d.strategies) setBtStrat(Object.keys(d.strategies)[0]);
      }).catch(()=>{});
    const loadPaper = () => {
      fetch(`${API}/paper/stats`).then(r=>r.json()).then(setPaperStats).catch(()=>{});
      fetch(`${API}/paper/positions`).then(r=>r.json()).then(setPaperPos).catch(()=>{});
    };
    const loadDrought = () =>
      fetch(`${API}/signals/drought`).then(r=>r.json()).then(setDrought).catch(()=>{});
    const loadComm = () => {
      fetch(`${API}/commodity/stats`).then(r=>r.json()).then(setCommStats).catch(()=>{});
      fetch(`${API}/commodity/trades?limit=100`).then(r=>r.json()).then(d=>setCommTrades(d.trades||[])).catch(()=>{});
      fetch(`${API}/commodity/trade-mode`).then(r=>r.json()).then(d=>{ if(d.mode) setCommMode(d.mode); }).catch(()=>{});
    };
    const loadConfig = () =>
      fetch(`${API}/config/strategies`).then(r=>r.json()).then(d=>{if(d.config)setStratConfig(d.config);}).catch(()=>{});
    const loadMcxConfig = () =>
      fetch(`${API}/commodity/config`).then(r=>r.json()).then(d=>{if(d.ok)setMcxConfig(d);}).catch(()=>{});

    loadServices(); loadBacktest(); loadPaper(); loadDrought(); loadComm(); loadConfig(); loadMcxConfig();
    // eslint-disable-next-line react-hooks/exhaustive-deps

    const t1 = setInterval(loadServices,   15000);
    const t2 = setInterval(loadPaper,       5000);
    const t3 = setInterval(loadDrought,    60000);
    const t5 = setInterval(loadComm,       60000);
    const t6 = setInterval(loadMcxConfig,  30000);  // refresh cooldown status every 30s
    return () => [t1,t2,t3,t5,t6].forEach(clearInterval);
  }, []);

  /* ── journal fetch: load on mount + when tab is opened ── */
  const loadJournal = React.useCallback((date) => {
    setJournalLoading(true);
    const url = date ? `${API}/decisions/daily?date=${date}` : `${API}/decisions/daily`;
    fetch(url).then(r=>r.json()).then(d=>{setJournal(d);setJournalLoading(false);}).catch(()=>setJournalLoading(false));
  }, []);
  React.useEffect(()=>{
    if(tab==="journal") loadJournal();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  },[tab]);


  const switchMode = m => fetch(`${API}/mode/${m}`, {method:"POST"});
  const confirm    = id => fetch(`${API}/signals/${id}/confirm`, {method:"POST"});
  const reject     = id => fetch(`${API}/signals/${id}/reject`, {method:"POST"});
  const resetKill  = () => fetch(`${API}/kill-switch/reset`, {method:"POST"});

  const { stats, risk, positions, pending_signals, mode } = data || {};
  const pnl    = stats?.total_pnl || 0;
  const pnlPct = stats?.total_pnl_pct || 0;
  const heat   = (positions||[]).reduce((s,p)=>s+(p.capital_at_risk||0),0) / ((stats?.total_capital||1)) * 100;
  const isPaper = mode === "AUTO" && paperStats?.mode === "PAPER";

  /* when paper mode is active, show paper wallet figures on the Trading tab */
  const displayPortVal = isPaper ? ((paperStats?.available_balance||0)+(paperStats?.capital_deployed||0)) : (stats?.portfolio_value||0);
  const displayPnl     = isPaper ? (paperStats?.total_pnl||0) : pnl;
  const displayPnlPct  = isPaper ? (paperStats?.total_pnl_pct||0) : pnlPct;
  const displayWinRate = isPaper ? (paperStats?.win_rate||0) : (stats?.win_rate||0);
  const displayDdPct   = isPaper ? (100-(paperStats?.balance_pct||100)) : (stats?.drawdown_pct||0);

  const logColor = line => {
    if (line.includes("CRITICAL") || line.includes("ERROR")) return "error";
    if (line.includes("WARNING")) return "warn";
    if (line.includes("SIGNAL") || line.includes("signal")) return "signal";
    if (line.includes("TRADE") || line.includes("PAPER") || line.includes("ORDER")) return "trade";
    return "info";
  };

  /* ── signal health mini-widget ── */
  function SignalHealthWidget() {
    if (!drought) return null;
    const { drought_days, drought_status, last_trade, top_3_reasons } = drought;
    if (drought_status === "OK") return (
      <div className="health-banner ok" style={{marginBottom:14}}>
        <span style={{color:"#22c55e",fontWeight:600}}>✓ Signals healthy</span>
        <span style={{color:"#64748b",marginLeft:10,fontSize:11}}>Last trade: {last_trade||"—"}</span>
      </div>
    );
    const cls = (drought_status||"warning").toLowerCase();
    const col = droughtColor(drought_status);
    return (
      <div className={`health-banner ${cls}`}>
        <div style={{textAlign:"center",flexShrink:0}}>
          <div className="health-drought" style={{color:col}}>{drought_days}</div>
          <div style={{fontSize:9,color:"#94a3b8",textTransform:"uppercase",marginTop:2}}>days dry</div>
        </div>
        <div style={{flex:1}}>
          <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
            <span style={{fontWeight:600,fontSize:13,color:col}}>{drought_status}</span>
            <span style={{fontSize:11,color:"#64748b"}}>No trades fired · Last: {last_trade||"—"}</span>
          </div>
          {(top_3_reasons||[]).map((b,i)=>(
            <div key={i} className="health-blocker">
              <div className="cat">#{i+1} — {b.category?.replace(/_/g," ")}</div>
              <div className="hint">{b.hint}</div>
            </div>
          ))}
        </div>
      </div>
    );
  }

  return (
    <div className="app">

      {/* ── Header ── */}
      <div className="header">
        <div>
          <span className={`pulse ${wsOk?"":"off"}`}/>
          <span style={{fontSize:18,fontWeight:600,color:"#f1f5f9"}}>AlphaLens Trading Bot</span>
          <span style={{fontSize:11,color:"#64748b",marginLeft:10}}>{wsOk?"● Live":"○ Reconnecting..."}</span>
          {isPaper && <span className="badge paper" style={{marginLeft:10}}>PAPER TRADING</span>}
        </div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <span className={`badge ${(mode||"").toLowerCase()}`}>{mode||"--"}</span>
          <button className="mode-btn" onClick={()=>switchMode("AUTO")}>AUTO</button>
          <button className="mode-btn" onClick={()=>switchMode("MANUAL")}>MANUAL</button>
        </div>
      </div>

      {/* ── System Alert Banner ── */}
      {sysAlerts.length > 0 && (
        <div className="sys-alert-bar">
          {sysAlerts.map(a => (
            <div key={a.component} className={`sys-alert ${a.severity}`}>
              <div className="sys-alert-icon">
                {a.severity==="critical" ? "🚨" : a.severity==="error" ? "⛔" : "⚠️"}
              </div>
              <div className="sys-alert-body">
                <div className="sys-alert-title">
                  ACTION REQUIRED — {a.component.replace(/_/g," ").toUpperCase()}
                </div>
                <div className="sys-alert-msg">{a.message}</div>
                <div className="sys-alert-meta">since {a.since} · updated {a.updated}</div>
              </div>
              {a.component==="fyers_token" && (
                <button
                  className="mode-btn"
                  style={{flexShrink:0,fontSize:10}}
                  onClick={()=>fetch(`${API}/system/token/refresh`,{method:"POST"})
                    .then(r=>r.json())
                    .then(d=>alert(d.ok ? "Token refreshed successfully" : `Refresh failed: ${d.error||d.status?.fail_count+" fails"}`))
                  }
                >
                  Refresh Token
                </button>
              )}
            </div>
          ))}
        </div>
      )}

      {/* ── Tabs ── */}
      <div className="tabs">
        {[["trading","Trading"],["journal","Daily Journal"],["paper","Paper P&L"],["learning","Learning"],["commodity","MCX Options"],["logs","Live Logs"],["services","Services"],["backtest","Backtest"],["config","Strategy Config"]].map(([id,label])=>(
          <button key={id} className={`tab ${tab===id?"active":""}`} onClick={()=>setTab(id)}>{label}</button>
        ))}
      </div>

      {/* ════════════════════════════════════════
          TRADING TAB
      ════════════════════════════════════════ */}
      {tab==="trading" && (
        <div>
          {risk?.kill_switch_active && (
            <div className="kill-banner">
              <span>🚨 KILL SWITCH — {risk.kill_switch_reason}</span>
              <button className="btn" style={{background:"#dc2626",color:"#fff"}} onClick={resetKill}>Reset</button>
            </div>
          )}

          <SignalHealthWidget/>

          <div className="grid4">
            <div className="metric"><div className="lbl">{isPaper?"Paper wallet value":"Portfolio value"}</div>
              <div className={`val ${displayPnl>=0?"up":"down"}`}>₹{fmt(displayPortVal)}</div></div>
            <div className="metric"><div className="lbl">Total P&L</div>
              <div className={`val ${displayPnl>=0?"up":"down"}`}>{displayPnl>=0?"+":""}₹{fmt(Math.abs(displayPnl))} <span style={{fontSize:13}}>({displayPnlPct>=0?"+":""}{displayPnlPct.toFixed(1)}%)</span></div></div>
            <div className="metric"><div className="lbl">Win rate</div>
              <div className="val neutral">{Number(displayWinRate).toFixed(0)}%</div></div>
            <div className="metric"><div className="lbl">{isPaper?"Wallet drawdown":"Drawdown"}</div>
              <div className={`val ${displayDdPct>2?"down":"neutral"}`}>{displayDdPct.toFixed(1)}%</div></div>
          </div>

          <div className="grid2">
            <div className="card">
              <h2>Open positions ({positions?.length||0})</h2>
              {!positions?.length ? <div className="empty">No open positions</div>
              : positions.map(p=>{
                const dispSym = ((p.options_meta||{}).nfo_symbol || p.symbol || "").replace("NSE:","").replace("-EQ","").replace("MCX:","");
                const idxSym  = (p.options_meta||{}).nfo_symbol ? (p.symbol||"").replace("NSE:","").replace("-EQ","") : null;
                const forceClose = () => {
                  if (!window.confirm(`Mark "${dispSym}" as closed?\n\nUse only if the broker already closed this position and the dashboard is showing stale data.`)) return;
                  fetch(`${API}/positions/force-close`, {
                    method: "POST",
                    headers: {"Content-Type":"application/json"},
                    body: JSON.stringify({symbol: p.symbol, reason: "BROKER_CLOSED"}),
                  })
                    .then(r=>r.json())
                    .then(d=>{
                      if (d.success) setPositions(prev => prev.filter(x=>x.symbol!==p.symbol));
                      else alert("Force close failed: " + (d.error||"unknown error"));
                    })
                    .catch(()=>alert("Request failed"));
                };
                return (
                <div key={p.id} className="pos-row">
                  <div>
                    <span style={{fontWeight:600,fontFamily:"monospace",color:"#f1f5f9"}}>{dispSym}</span>
                    {idxSym && <span style={{fontSize:9,color:"#94a3b8",marginLeft:4}}>{idxSym}</span>}
                    <span className={`badge ${p.direction.toLowerCase()}`} style={{marginLeft:6}}>{p.direction}</span>
                    <div style={{fontSize:10,color:"#94a3b8",marginTop:2}}>{p.strategy} · {p.position_size} {p.signal_type==="OPTIONS"?"units":"shares"}</div>
                  </div>
                  <div style={{textAlign:"right",display:"flex",flexDirection:"column",alignItems:"flex-end",gap:4}}>
                    <div className={p.unrealised_pnl>=0?"up":"down"} style={{fontSize:15,fontWeight:600}}>
                      {p.unrealised_pnl>=0?"+":""}₹{fmt(Math.abs(p.unrealised_pnl))}
                    </div>
                    <div style={{fontSize:10,color:"#94a3b8"}}>₹{p.entry_price} → ₹{p.ltp}</div>
                    <button
                      onClick={forceClose}
                      title="Mark as closed — use when broker already closed this but dashboard shows stale data"
                      style={{background:"transparent",border:"1px solid #7f1d1d",color:"#f87171",borderRadius:3,fontSize:9,padding:"2px 7px",cursor:"pointer",lineHeight:"1.4",marginTop:2}}>
                      × Mark Closed
                    </button>
                  </div>
                </div>
              )})}
            </div>
            <div className="card">
              <h2>Risk metrics</h2>
              <div style={{display:"grid",gap:10}}>
                <div>
                  <div style={{display:"flex",justifyContent:"space-between",fontSize:12}}>
                    <span style={{color:"#94a3b8"}}>Portfolio heat</span>
                    <span className={heat>50?"down":"neutral"}>{heat.toFixed(1)}%</span>
                  </div>
                  <div className="risk-bar"><div className="risk-bar-fill" style={{width:`${Math.min(heat,100)}%`,background:heat>50?"#ef4444":heat>30?"#f59e0b":"#22c55e"}}/></div>
                </div>
                {[["Daily P&L",`₹${fmt(risk?.daily_realised_pnl)}`,risk?.daily_realised_pnl>=0?"up":"down"],
                  ["Daily loss limit",`${risk?.daily_loss_limit}%`,"neutral"],
                  ["Risk per trade",`${risk?.risk_per_trade_pct}%`,"neutral"],
                  ["Open positions",stats?.open_positions_count||0,"neutral"],
                  ["Total trades",stats?.total_trades||0,"neutral"],
                  ["Avg R:R",stats?.avg_rr?.toFixed(2)||"—","neutral"],
                ].map(([lbl,val,cls])=>(
                  <div key={lbl} style={{display:"flex",justifyContent:"space-between",fontSize:12}}>
                    <span style={{color:"#94a3b8"}}>{lbl}</span>
                    <span className={cls}>{val}</span>
                  </div>
                ))}
              </div>
            </div>
          </div>

          <div className="card">
            <h2>Signals awaiting confirmation ({pending_signals?.length||0})</h2>
            {!pending_signals?.length ? <div className="empty">No pending signals — bot is scanning markets</div>
            : pending_signals.map(s=>(
              <div key={s.signal_id} className="signal-card">
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <span style={{fontWeight:600,color:"#f1f5f9"}}>{s.symbol.replace("NSE:","").replace("-EQ","")} — {s.direction}</span>
                  <div style={{display:"flex",gap:6,alignItems:"center"}}>
                    <span style={{fontSize:11,color:"#f59e0b"}}>{(s.confidence*100).toFixed(0)}% conf</span>
                    <span className="badge manual">{s.strategy}</span>
                  </div>
                </div>
                <div style={{fontSize:11,color:"#94a3b8",margin:"6px 0"}}>{s.reason}</div>
                <div className="signal-levels">
                  <div className="level"><div className="lbl">Entry</div><div className="val" style={{color:"#93c5fd"}}>₹{s.entry}</div></div>
                  <div className="level"><div className="lbl">Stop</div><div className="val" style={{color:"#fca5a5"}}>₹{s.stop_loss}</div></div>
                  <div className="level"><div className="lbl">Target</div><div className="val" style={{color:"#86efac"}}>₹{s.target_1}</div></div>
                </div>
                <div style={{fontSize:11,color:"#94a3b8",marginBottom:10}}>R:R {s.risk_reward} · {s.position_size} shares · ₹{(s.capital_at_risk||0).toLocaleString("en-IN")}</div>
                <div className="btn-row">
                  <button className="btn btn-confirm" onClick={()=>confirm(s.signal_id)}>✓ Confirm</button>
                  <button className="btn btn-reject" onClick={()=>reject(s.signal_id)}>✕ Reject</button>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}

      {/* ════════════════════════════════════════
          PAPER P&L TAB
      ════════════════════════════════════════ */}
      {tab==="paper" && (
        <div>
          <div className="paper-banner">
            📝 Paper wallet — ₹5L corpus tracking all learning-mirrored trades. Not your live portfolio.
          </div>
          {paperStats ? (
            <div>
              {/* Wallet row — most important number first */}
              <div className="grid4" style={{marginBottom:10}}>
                <div className="metric">
                  <div className="lbl">Wallet balance</div>
                  <div className={`val ${(paperStats.total_pnl||0)>=0?"up":"down"}`}>
                    ₹{fmt(paperStats.available_balance||0)}
                  </div>
                </div>
                <div className="metric">
                  <div className="lbl">Starting capital</div>
                  <div className="val neutral">₹{fmt(paperStats.starting_capital||500000)}</div>
                </div>
                <div className="metric">
                  <div className="lbl">Capital deployed</div>
                  <div className="val amber">₹{fmt(paperStats.capital_deployed||0)}</div>
                </div>
                <div className="metric">
                  <div className="lbl">Wallet %</div>
                  <div className={`val ${(paperStats.balance_pct||100)>=100?"up":(paperStats.balance_pct||100)>=70?"neutral":"down"}`}>
                    {paperStats.balance_pct||100}%
                  </div>
                </div>
              </div>
              <div className="grid4" style={{marginBottom:16}}>
                <div className="metric"><div className="lbl">Total P&L</div>
                  <div className={`val ${(paperStats.total_pnl||0)>=0?"up":"down"}`}>
                    {(paperStats.total_pnl||0)>=0?"+":""}₹{fmt(paperStats.total_pnl||0)}
                  </div></div>
                <div className="metric"><div className="lbl">Win rate</div>
                  <div className={`val ${(paperStats.win_rate||0)>=50?"up":"down"}`}>{paperStats.win_rate||0}%</div></div>
                <div className="metric"><div className="lbl">Profit factor</div>
                  <div className={`val ${(paperStats.profit_factor||0)>=1.5?"up":(paperStats.profit_factor||0)>=1?"neutral":"down"}`}>{paperStats.profit_factor||0}</div></div>
                <div className="metric"><div className="lbl">Total trades</div>
                  <div className="val neutral">{paperStats.total_trades||0}</div></div>
              </div>
              <div className="grid2">
                <div className="card">
                  <h2>Performance</h2>
                  {[["Realised P&L",`₹${fmt(paperStats.total_realised)}`,(paperStats.total_realised||0)>=0?"up":"down"],
                    ["Unrealised P&L",`₹${fmt(paperStats.total_unrealised)}`,(paperStats.total_unrealised||0)>=0?"up":"down"],
                    ["Return on ₹5L",`${paperStats.total_pnl_pct||0}%`,(paperStats.total_pnl_pct||0)>=0?"up":"down"],
                    ["Avg winner",`₹${fmt(paperStats.avg_winner)}`,"up"],
                    ["Avg loser",`₹${fmt(paperStats.avg_loser)}`,"down"],
                    ["Open positions",paperStats.open_positions||0,"neutral"],
                  ].map(([lbl,val,cls])=>(
                    <div key={lbl} style={{display:"flex",justifyContent:"space-between",padding:"6px 0",borderBottom:"1px solid #111827",fontSize:12}}>
                      <span style={{color:"#94a3b8"}}>{lbl}</span>
                      <span className={cls}>{val}</span>
                    </div>
                  ))}
                </div>
                <div className="card">
                  <h2>Open paper positions ({paperPos.length})</h2>
                  {!paperPos.length ? <div className="empty">No open paper positions</div>
                  : paperPos.map(p=>{
                    const dispSym = (p.nfo_symbol || p.symbol || "").replace("NSE:","").replace("-EQ","").replace("MCX:","");
                    const idxSym  = p.nfo_symbol ? (p.symbol||"").replace("NSE:","").replace("-EQ","") : null;
                    return (
                    <div key={p.id} className="pos-row">
                      <div>
                        <span style={{fontWeight:600,fontFamily:"monospace"}}>{dispSym}</span>
                        {idxSym && <span style={{fontSize:9,color:"#94a3b8",marginLeft:4}}>{idxSym}</span>}
                        <span className={`badge ${p.direction.toLowerCase()}`} style={{marginLeft:6}}>{p.direction}</span>
                        <div style={{fontSize:10,color:"#94a3b8",marginTop:2}}>{p.strategy} · <span style={{color:"#94a3b8"}}>{p.position_size} {p.instrument_type==="nse_options"?"units":"shares"}</span></div>
                      </div>
                      <div style={{textAlign:"right"}}>
                        <div className={p.unrealised_pnl>=0?"up":"down"} style={{fontWeight:600}}>
                          {p.unrealised_pnl>=0?"+":""}₹{fmt(Math.abs(p.unrealised_pnl))}
                        </div>
                        <div style={{fontSize:10,color:"#94a3b8"}}>₹{p.entry_price} → ₹{p.ltp}</div>
                      </div>
                    </div>
                  )})}
                </div>
              </div>
            </div>
          ) : <div className="empty">Loading paper trading stats...</div>}
        </div>
      )}

      {/* ════════════════════════════════════════
          LEARNING TAB
      ════════════════════════════════════════ */}
      <div style={{display: tab==="learning" ? "block" : "none"}}>
        <LearningTabContent trades={learnTrades} ltps={learnLtps} learnStats={learnStats}/>
      </div>

      {/* ════════════════════════════════════════
          MCX COMMODITY OPTIONS TAB
      ════════════════════════════════════════ */}
      <div style={{display: tab==="commodity" ? "block" : "none"}}>
        <CommodityTabContent trades={commTrades} ltps={commLtps} commStats={commStats}
          mcxConfig={mcxConfig}
          commMode={commMode}
          commModeBusy={commModeBusy}
          onModeToggle={() => {
            const target = commMode === "PAPER" ? "real" : "paper";
            if (target === "real" && !confirm(
              "Switch to REAL trading?\n\nThis will place LIVE orders on your Fyers account.\nMake sure your broker account has sufficient funds.\n\nContinue?"
            )) return;
            setCommModeBusy(true);
            fetch(`${API}/commodity/trade-mode/${target}`, {method:"POST"})
              .then(r=>r.json())
              .then(d=>{
                if(d.mode) setCommMode(d.mode);
                if(d.error) alert("Error: " + d.error);
              })
              .catch(e=>alert("Request failed: "+e))
              .finally(()=>setCommModeBusy(false));
          }}
          onManualClose={() => {
            fetch(`${API}/commodity/stats`).then(r=>r.json()).then(setCommStats).catch(()=>{});
            fetch(`${API}/commodity/trades?limit=100`).then(r=>r.json()).then(d=>setCommTrades(d.trades||[])).catch(()=>{});
          }}
        />
      </div>

      {/* ════════════════════════════════════════
          LIVE LOGS TAB
      ════════════════════════════════════════ */}
      {tab==="logs" && (
        <div>
          <div className="card">
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
              <h2 style={{margin:0}}>Live bot log</h2>
              <div style={{display:"flex",gap:8}}>
                <button className="mode-btn" onClick={()=>setLogs([])}>Clear</button>
                <span style={{fontSize:11,color:"#64748b"}}>{logs.length} lines</span>
              </div>
            </div>
            <div className="log-box" ref={logRef}>
              {logs.map((line,i)=>(
                <div key={i} className={`log-line ${logColor(line)}`}>{line}</div>
              ))}
              {!logs.length && <div style={{color:"#64748b"}}>Connecting to log stream...</div>}
            </div>
          </div>
          <div className="card">
            <h2>Color guide</h2>
            <div style={{display:"flex",gap:16,fontSize:12,flexWrap:"wrap"}}>
              {[["#22c55e","SIGNAL — trade setup found"],["#93c5fd","TRADE — order placed/closed"],["#f59e0b","WARNING — non-critical issue"],["#ef4444","ERROR — needs attention"],["#64748b","INFO — normal activity"]].map(([c,lbl])=>(
                <div key={c} style={{display:"flex",alignItems:"center",gap:6}}>
                  <span style={{width:10,height:10,borderRadius:"50%",background:c,display:"inline-block"}}></span>
                  <span style={{color:"#94a3b8"}}>{lbl}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* ════════════════════════════════════════
          SERVICES TAB
      ════════════════════════════════════════ */}
      {tab==="services" && (
        <div>
          <div className="grid2">
            <div className="card">
              <h2>Process status</h2>
              {services ? (
                [["bot","Trading Bot"],["watchdog","Watchdog"],["dashboard","Dashboard Server"],["cron","Cron Scheduler"]].map(([key,label])=>{
                  const svc = services[key];
                  const running = svc?.running;
                  return (
                    <div key={key} className="svc-row">
                      <div style={{display:"flex",alignItems:"center"}}>
                        <span className="svc-dot" style={{background:running?"#22c55e":"#ef4444"}}></span>
                        <span style={{color:"#e2e8f0"}}>{label}</span>
                      </div>
                      <span className={`badge ${running?"ok":"err"}`}>{running?"RUNNING":"STOPPED"}</span>
                    </div>
                  );
                })
              ) : <div className="empty">Loading...</div>}
              {services?.uptime && (
                <div style={{marginTop:12,fontSize:11,color:"#64748b"}}>Bot uptime: {services.uptime}</div>
              )}
            </div>
            <div className="card">
              <h2>Scheduled jobs</h2>
              {services ? (
                [["token_refresh","Token Refresh","11:45 PM IST daily"],["nightly_agent","Nightly Agent","8:30 PM IST daily"],["weekly_agent","Weekly Agent","9:00 AM IST Sunday"]].map(([key,label,schedule])=>{
                  const svc = services[key];
                  return (
                    <div key={key} className="svc-row">
                      <div>
                        <div style={{color:"#e2e8f0",fontSize:12}}>{label}</div>
                        <div style={{color:"#64748b",fontSize:10}}>{schedule}</div>
                      </div>
                      <div style={{textAlign:"right"}}>
                        <div style={{fontSize:10,color:"#94a3b8"}}>Last run</div>
                        <div style={{fontSize:11,color:"#94a3b8"}}>{svc?.last_run||"Never"}</div>
                      </div>
                    </div>
                  );
                })
              ) : <div className="empty">Loading...</div>}
            </div>
          </div>
          <div className="card">
            <h2>Quick commands</h2>
            <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>
              {[
                ["Run nightly agent","/agents/nightly","POST","Takes 2-5 mins — watch Live Logs"],
                ["Run weekly backtest","/agents/weekly","POST","Takes 10-15 mins — watch Live Logs"],
                ["Refresh daily plan","/plan/refresh","POST","Regenerates today checklist"],
                ["Reset kill switch","/kill-switch/reset","POST","Re-enables trading after kill"],
              ].map(([label,endpoint,method,note])=>(
                <button key={endpoint} className="mode-btn"
                  style={{padding:"10px 14px",textAlign:"left",display:"block",width:"100%",marginBottom:4}}
                  onClick={()=>{
                    fetch(`${API}${endpoint}`,{method}).then(r=>r.json()).then(d=>{
                      alert(d.message || d.ok ? `Started: ${label}\n${note}` : `Error: ${JSON.stringify(d)}`);
                    }).catch(e=>alert(`Error: ${e}`));
                  }}>
                  <div style={{fontWeight:500,color:"#e2e8f0"}}>{label}</div>
                  <div style={{fontSize:10,color:"#94a3b8",marginTop:2}}>{note}</div>
                </button>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* ════════════════════════════════════════
          BACKTEST TAB
      ════════════════════════════════════════ */}
      {tab==="backtest" && (
        <div>
          {!backtest ? <div className="empty">Loading backtest results...</div>
          : !backtest.available ? (
            <div className="card">
              <div className="empty" style={{padding:40}}>
                <div style={{fontSize:24,marginBottom:12}}>📊</div>
                <div style={{color:"#94a3b8",marginBottom:8}}>{backtest.message||"No backtest results yet"}</div>
                <div style={{fontSize:11,color:"#64748b"}}>Run weekly_agent.py to generate backtest results</div>
                <button className="mode-btn" style={{marginTop:14}}
                  onClick={()=>fetch(`${API}/agents/nightly`,{method:"POST"}).then(r=>r.json()).then(d=>alert(d.message||"Started — check Live Logs tab"))}>
                  Run nightly agent (generates backtest results)
                </button>
              </div>
            </div>
          ) : (
            <div>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
                <div style={{fontSize:12,color:"#94a3b8"}}>Week ending: {backtest.week_ending}</div>
                <div style={{display:"flex",gap:6}}>
                  {Object.keys(backtest.strategies||{}).map(s=>(
                    <button key={s} className={`mode-btn ${btStrat===s?"active":""}`}
                      style={{background:btStrat===s?"#1e3a5f":"",color:btStrat===s?"#93c5fd":""}}
                      onClick={()=>setBtStrat(s)}>{s}</button>
                  ))}
                </div>
              </div>
              {btStrat && backtest.strategies[btStrat] && (() => {
                const st = backtest.strategies[btStrat];
                return (
                  <div>
                    <div className="grid3">
                      <div className="metric"><div className="lbl">Avg profit factor</div>
                        <div className={`val ${st.avg_profit_factor>=1.5?"up":st.avg_profit_factor>=1?"neutral":"down"}`}>{st.avg_profit_factor?.toFixed(2)}</div></div>
                      <div className="metric"><div className="lbl">Top symbols</div>
                        <div style={{fontSize:11,color:"#22c55e",marginTop:4,lineHeight:1.6}}>
                          {(st.top_10||[]).slice(0,5).map(s=>s.replace("NSE:","").replace("-EQ","")).join(", ")}
                        </div></div>
                      <div className="metric"><div className="lbl">Avoid</div>
                        <div style={{fontSize:11,color:"#ef4444",marginTop:4,lineHeight:1.6}}>
                          {(st.avoid||[]).slice(0,5).map(s=>s.replace("NSE:","").replace("-EQ","")).join(", ")}
                        </div></div>
                    </div>
                    <div className="card">
                      <h2>Symbol performance leaderboard</h2>
                      <table className="bt-table">
                        <thead>
                          <tr>
                            <th>Symbol</th><th>Trades</th><th>Win %</th><th>PF</th><th>Sharpe</th><th>Return</th><th>Max DD</th>
                          </tr>
                        </thead>
                        <tbody>
                          {(st.leaderboard||[]).map((r,i)=>(
                            <tr key={i}>
                              <td style={{fontFamily:"monospace",color:"#f1f5f9"}}>{r.symbol.replace("NSE:","").replace("-EQ","")}</td>
                              <td>{r.total_trades}</td>
                              <td className={r.win_rate>=55?"good":r.win_rate>=45?"":"bad"}>{r.win_rate?.toFixed(0)}%</td>
                              <td className={r.profit_factor>=1.5?"good":r.profit_factor>=1?"":"bad"}>{r.profit_factor?.toFixed(2)}</td>
                              <td className={r.sharpe>=1?"good":r.sharpe>=0.5?"":"bad"}>{r.sharpe?.toFixed(2)}</td>
                              <td className={r.total_return>=0?"good":"bad"}>{r.total_return>=0?"+":""}{r.total_return?.toFixed(1)}%</td>
                              <td className={r.max_drawdown>20?"bad":r.max_drawdown>10?"":"good"}>{r.max_drawdown?.toFixed(1)}%</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                );
              })()}
            </div>
          )}
        </div>
      )}

      {/* ════════════════════════════════════════
          DAILY JOURNAL TAB
      ════════════════════════════════════════ */}
      {tab==="journal" && (() => {
        const j = journal;
        const s = j?.session || {};

        const outcomeLabels = {
          traded:           "Traded",
          paper_traded:     "Paper Traded",
          vetoed:           "Intelligence Veto",
          risk_rejected:    "Risk Rejected",
          signal_generated: "Signal Only",
        };
        const rejectionLabels = {
          earnings_blackout:  "Earnings Blackout",
          macro_veto:         "Macro Veto",
          intelligence_veto:  "Intelligence Veto",
          poor_risk_reward:   "Poor R:R",
          portfolio_heat:     "Portfolio Heat",
          daily_loss_limit:   "Daily Loss Limit",
          cooldown:           "Cooldown",
          max_positions:      "Max Positions",
          risk:               "Risk Check",
          other:              "Other",
        };

        const filteredSymbols = (j?.symbols || []).filter(sym => {
          if (jFilter === "all")    return true;
          if (jFilter === "active") return sym.outcome !== "no_setup";
          return sym.outcome === jFilter;
        });

        const handleDateSearch = () => {
          if (jDate.match(/^\d{4}-\d{2}-\d{2}$/)) loadJournal(jDate);
          else loadJournal();
        };

        return (
          <div>
            {/* Date selector */}
            <div className="journal-date-row">
              <input
                type="date"
                className="journal-date-input"
                value={jDate}
                onChange={e => setJDate(e.target.value)}
                onKeyDown={e => e.key==="Enter" && handleDateSearch()}
              />
              <button className="mode-btn" onClick={handleDateSearch} style={{fontSize:12}}>Load</button>
              <button className="mode-btn" onClick={()=>{setJDate("");loadJournal();}} style={{fontSize:12}}>Today</button>
              <button className="mode-btn" onClick={()=>loadJournal(jDate||undefined)} style={{fontSize:12}}>Refresh</button>
              {journalLoading && <span style={{fontSize:11,color:"#94a3b8"}}>Loading...</span>}
              {j && <span style={{fontSize:11,color:"#64748b",marginLeft:4}}>{j.date}</span>}
            </div>

            {!j ? (
              <div className="journal-empty">No journal data loaded</div>
            ) : (
              <>
                {/* ── Conviction Score Card ── */}
                {j.conviction && (() => {
                  const cv = j.conviction;
                  const dir = (cv.direction||"neutral").toLowerCase();
                  const scoreClass = cv.tradeable ? dir : "neutral";
                  const signals = [
                    { label:"FII F&O",    score: cv.fii_score,  reason: (cv.reasons||[]).find(r=>r.startsWith("FII")) || "" },
                    { label:"OI / PCR",   score: cv.oi_score,   reason: (cv.reasons||[]).find(r=>r.startsWith("OI"))  || "" },
                    { label:"Pre-open IEP",score:cv.iep_score,  reason: (cv.reasons||[]).find(r=>r.startsWith("IEP")) || "" },
                    { label:"India VIX",  score: cv.vix_score,  reason: (cv.reasons||[]).find(r=>r.startsWith("VIX")) || "" },
                    { label:"Gift Nifty", score: cv.gift_score, reason: (cv.reasons||[]).find(r=>r.startsWith("GIFT"))|| "" },
                    { label:"BankNifty RS",score:cv.rs_score,   reason: (cv.reasons||[]).find(r=>r.startsWith("RS"))  || "" },
                  ];
                  const scoreColor = scoreClass==="bullish"?"#22c55e":scoreClass==="bearish"?"#ef4444":"#f59e0b";
                  return (
                    <div className="conviction-card">
                      <div className="conviction-header">
                        <div>
                          <div style={{fontSize:10,color:"#94a3b8",textTransform:"uppercase",letterSpacing:".07em",marginBottom:4}}>Pre-market Conviction Score</div>
                          <div className={`conviction-score-big ${scoreClass}`}>{cv.score > 0 ? `+${cv.score}` : cv.score}<span style={{fontSize:14,color:"#64748b"}}>/10</span></div>
                        </div>
                        <div className="conviction-meta">
                          <div className={`conviction-direction ${scoreClass}`}>{cv.direction}</div>
                          <div className="conviction-tradeable" style={{color: cv.tradeable ? "#22c55e" : "#f59e0b"}}>
                            {cv.tradeable ? `TRADEABLE — deploying ${cv.capital_pct}% capital` : `BELOW THRESHOLD — no index trade (need ±7, got ${cv.score > 0 ? '+' : ''}${cv.score})`}
                          </div>
                          <div className="conviction-timestamp">{cv.timestamp || cv.date}</div>
                        </div>
                        <div style={{textAlign:"right"}}>
                          <div style={{fontSize:10,color:"#94a3b8",marginBottom:4}}>Threshold</div>
                          <div style={{fontFamily:"monospace",fontWeight:700,fontSize:16,color:"#64748b"}}>±7</div>
                        </div>
                      </div>
                      <div className="conviction-signals">
                        {signals.map(sig=>{
                          const sc = sig.score||0;
                          const cls = sc>0?"pos":sc<0?"neg":"zero";
                          const rawReason = sig.reason.replace(/^[A-Z]+\s*\[[\+\-]\d+\]:\s*/,"");
                          return (
                            <div key={sig.label} className="conviction-signal">
                              <div className="conviction-signal-label">{sig.label}</div>
                              <div className="conviction-signal-row">
                                <span className={`conviction-signal-score ${cls}`}>{sc>0?`+${sc}`:sc}</span>
                                <span style={{fontSize:9,color:"#64748b"}}>
                                  {sig.label==="FII F&O"?"max ±3":sig.label==="OI / PCR"||sig.label==="Pre-open IEP"?"max ±2":"max ±1"}
                                </span>
                              </div>
                              <div className="conviction-signal-reason">{rawReason}</div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  );
                })()}

                {/* Session summary */}
                <div className="journal-session">
                  <div className="metric"><div className="lbl">Bot Started</div><div className="val neutral" style={{fontSize:14}}>{s.bot_started||"—"}</div></div>
                  <div className="metric"><div className="lbl">Symbols Active</div><div className="val neutral">{s.total_symbols_active||0}</div></div>
                  <div className="metric"><div className="lbl">Signals Generated</div><div className="val" style={{color:"#3b82f6"}}>{s.total_signals_generated||0}</div></div>
                  <div className="metric"><div className="lbl">Vetoed / Rejected</div>
                    <div className="val" style={{color:"#ef4444",fontSize:18}}>
                      {s.total_vetoed||0} <span style={{color:"#f97316"}}>/ {s.total_rejected||0}</span>
                    </div>
                  </div>
                  <div className="metric"><div className="lbl">Trades Placed</div>
                    <div className={`val ${(s.total_traded||0)>0?"up":"neutral"}`}>{s.total_traded||0}</div>
                  </div>
                </div>

                {/* Session events (mode changes, kill switch) */}
                {(s.session_events||[]).filter(e=>e.type!=="TOKEN_REFRESH").length > 0 && (
                  <div className="card" style={{padding:"12px 16px",marginBottom:12}}>
                    <h2>Session events</h2>
                    {(s.session_events||[]).filter(e=>e.type!=="TOKEN_REFRESH").map((e,i)=>(
                      <div key={i} style={{display:"flex",gap:12,fontSize:11,padding:"3px 0",borderBottom:"1px solid #1e2433"}}>
                        <span style={{color:"#64748b",fontFamily:"monospace",flexShrink:0}}>{e.time}</span>
                        <span style={{color:"#f59e0b",fontWeight:600,minWidth:100}}>{e.type.replace("_"," ")}</span>
                        <span style={{color:"#94a3b8"}}>{e.reason}</span>
                      </div>
                    ))}
                  </div>
                )}

                {/* Rejection breakdown */}
                {Object.keys(j.rejection_breakdown||{}).length > 0 && (
                  <div style={{marginBottom:16}}>
                    <div className="journal-section-hdr">Why signals were blocked today</div>
                    <div className="rejection-pills">
                      {Object.entries(j.rejection_breakdown).sort((a,b)=>b[1]-a[1]).map(([k,v])=>(
                        <div key={k} className="rejection-pill">
                          <span className="rp-count">{v}</span>
                          <span className="rp-label">{rejectionLabels[k]||k.replace(/_/g," ")}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                )}

                {/* Trades placed */}
                {(j.trades||[]).length > 0 && (
                  <div className="card" style={{marginBottom:16}}>
                    <h2>Trades placed ({j.trades.length})</h2>
                    {j.trades.map((t,i)=>(
                      <div key={i} className="journal-trade-row">
                        <div>
                          <span style={{fontFamily:"monospace",fontWeight:700,color:"#f1f5f9"}}>{t.display}</span>
                          <span className={`badge ${(t.direction||"").toLowerCase()}`} style={{marginLeft:6}}>{t.direction}</span>
                          {t.paper && <span className="badge paper" style={{marginLeft:4}}>PAPER</span>}
                          <span style={{fontSize:10,color:"#94a3b8",marginLeft:8}}>{t.strategy}</span>
                        </div>
                        <div style={{textAlign:"right",fontFamily:"monospace"}}>
                          <span style={{color:"#94a3b8"}}>{t.qty} qty @ </span>
                          <span style={{color:"#f1f5f9"}}>₹{(t.price||0).toFixed(2)}</span>
                          <span style={{color:"#64748b",fontSize:10,marginLeft:8}}>{t.time}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                {/* Per-symbol decisions */}
                <div className="journal-section-hdr">Signal decisions by symbol</div>
                <div className="journal-filter-btns" style={{marginBottom:12}}>
                  {[["all","All"],["traded","Traded"],["vetoed","Vetoed"],["risk_rejected","Risk Rejected"],["signal_generated","Signal Only"]].map(([k,l])=>(
                    <button key={k} className={`journal-filter-btn ${jFilter===k?"active":""}`} onClick={()=>setJFilter(k)}>{l}</button>
                  ))}
                </div>

                {filteredSymbols.length === 0 && (
                  <div className="journal-empty">No activity matching this filter for {j.date}</div>
                )}

                {filteredSymbols.map(sym=>{
                  const isOpen = jExpanded[sym.symbol];
                  const oc = sym.outcome.toLowerCase();
                  return (
                    <div key={sym.symbol} className={`journal-sym-card ${oc}`}>
                      <div className="journal-sym-header" onClick={()=>setJExpanded(p=>({...p,[sym.symbol]:!p[sym.symbol]}))} style={{cursor:"pointer"}}>
                        <div>
                          <span className="journal-sym-name">{sym.display}</span>
                          <span style={{fontSize:10,color:"#64748b",marginLeft:8,fontFamily:"monospace"}}>{sym.symbol}</span>
                        </div>
                        <div style={{display:"flex",gap:8,alignItems:"center"}}>
                          <span className={`journal-outcome-badge outcome-${oc}`}>{outcomeLabels[oc]||oc}</span>
                          <span style={{color:"#64748b",fontSize:12}}>{isOpen?"▲":"▼"}</span>
                        </div>
                      </div>
                      {sym.final_reason && (
                        <div className="journal-reason">{sym.final_reason}</div>
                      )}
                      {isOpen && (
                        <div className="journal-events">
                          {sym.events.map((ev,i)=>(
                            <div key={i} className="journal-event">
                              <span className="journal-event-time">{ev.time}</span>
                              <span className={`journal-event-type ${ev.type}`}>{ev.type.replace(/_/g," ")}</span>
                              <span className="journal-event-reason">
                                {ev.direction && <span style={{color:"#3b82f6",marginRight:4}}>{ev.direction}</span>}
                                {ev.strategy && <span style={{color:"#94a3b8",marginRight:4}}>[{ev.strategy}]</span>}
                                {ev.reason}
                                {ev.price > 0 && <span style={{color:"#94a3b8",marginLeft:4}}>@ ₹{ev.price.toFixed(2)}</span>}
                              </span>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  );
                })}
              </>
            )}
          </div>
        );
      })()}

      {/* ════════════════════════════════════════
          STRATEGY CONFIG TAB
      ════════════════════════════════════════ */}
      {tab==="config" && (
        <div>
          <div className="card">
            <h2>NSE Strategy Configuration</h2>
            <StrategyConfigPage
              config={stratConfig}
              onUpdate={(strat, param, value) => {
                setStratConfig(prev => {
                  if (!prev || !prev[strat] || !prev[strat][param]) return prev;
                  return {
                    ...prev,
                    [strat]: { ...prev[strat], [param]: { ...prev[strat][param], value } }
                  };
                });
              }}
            />
          </div>
          <div className="card" style={{marginTop:16}}>
            <h2>MCX Commodity Strategy Configuration</h2>
            <McxConfigPage
              config={mcxConfig}
              onUpdate={(strat, param, value) => {
                setMcxConfig(prev => {
                  if (!prev?.strategies?.[strat]) return prev;
                  return {
                    ...prev,
                    strategies: {
                      ...prev.strategies,
                      [strat]: { ...prev.strategies[strat], [param]: value }
                    }
                  };
                });
              }}
              onRefresh={() =>
                fetch(`${API}/commodity/config`).then(r=>r.json())
                  .then(d=>{ if(d.ok) setMcxConfig(d); }).catch(()=>{})
              }
            />
          </div>
        </div>
      )}

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
