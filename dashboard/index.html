<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AlphaLens Trading Bot</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',sans-serif;background:#0f1117;color:#e2e8f0;font-size:14px}
    .app{max-width:1400px;margin:0 auto;padding:16px}
    .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid #1e2433}
    .header h1{font-size:18px;font-weight:600;color:#f1f5f9}
    .pulse{width:8px;height:8px;border-radius:50%;background:#22c55e;display:inline-block;margin-right:8px;animation:pulse 1.5s infinite}
    .pulse.off{background:#ef4444;animation:none}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
    .tabs{display:flex;gap:4px;background:#151a28;border-radius:8px;padding:4px;margin-bottom:20px;flex-wrap:wrap}
    .tab{padding:7px 16px;border-radius:6px;border:none;cursor:pointer;background:transparent;color:#94a3b8;font-size:13px;transition:all .15s}
    .tab.active{background:#1e293b;color:#f1f5f9;border:1px solid #334155}
    .tab:hover:not(.active){color:#94a3b8}
    .card{background:#1e2433;border:1px solid #2d3748;border-radius:12px;padding:18px;margin-bottom:16px}
    .card h2{font-size:12px;color:#94a3b8;letter-spacing:.08em;text-transform:uppercase;margin-bottom:14px;font-weight:500}
    .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
    .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:16px}
    .metric{background:#151a28;border-radius:8px;padding:12px 14px}
    .metric .lbl{font-size:10px;color:#94a3b8;text-transform:uppercase;letter-spacing:.08em;margin-bottom:5px}
    .metric .val{font-size:20px;font-weight:600;font-family:'Courier New',monospace}
    .up{color:#22c55e}.down{color:#ef4444}.neutral{color:#94a3b8}.amber{color:#f59e0b}.orange{color:#f97316}
    .badge{padding:2px 8px;border-radius:4px;font-size:11px;font-weight:500}
    .badge.long{background:#14532d;color:#86efac}
    .badge.short{background:#450a0a;color:#fca5a5}
    .badge.auto{background:#14532d;color:#86efac}
    .badge.manual{background:#1e3a5f;color:#93c5fd}
    .badge.paper{background:#3b2f0a;color:#fcd34d}
    .badge.ok{background:#14532d;color:#86efac}
    .badge.err{background:#450a0a;color:#fca5a5}
    .mode-btn{padding:6px 14px;border-radius:6px;border:1px solid #334155;background:#1e293b;color:#94a3b8;cursor:pointer;font-size:12px}
    .mode-btn:hover{background:#263548}
    .signal-card{background:#151a28;border:1px solid #f59e0b44;border-radius:8px;padding:14px;margin-bottom:10px}
    .signal-levels{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:10px 0}
    .level{background:#1e2433;border-radius:6px;padding:8px;text-align:center}
    .level .lbl{font-size:9px;color:#94a3b8;text-transform:uppercase;margin-bottom:3px}
    .level .val{font-size:13px;font-weight:600;font-family:monospace}
    .btn-row{display:flex;gap:8px}
    .btn{padding:7px 18px;border-radius:6px;border:none;cursor:pointer;font-size:12px;font-weight:500}
    .btn-confirm{background:#166534;color:#86efac}
    .btn-reject{background:#7f1d1d;color:#fca5a5}
    .btn:hover{opacity:.85}
    .kill-banner{background:#7f1d1d;border:1px solid #dc2626;border-radius:8px;padding:10px 14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
    .risk-bar{height:5px;background:#1e2433;border-radius:3px;overflow:hidden;margin-top:6px}
    .risk-bar-fill{height:100%;border-radius:3px;transition:width .5s}
    .empty{color:#64748b;font-size:12px;text-align:center;padding:20px}
    .pos-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #1e2433;font-size:12px}
    .pos-row:last-child{border-bottom:none}
    .log-box{background:#0a0e17;border:1px solid #1e2433;border-radius:8px;padding:12px;height:320px;overflow-y:auto;font-family:'Courier New',monospace;font-size:11px;line-height:1.6}
    .log-line{padding:1px 0;white-space:pre-wrap;word-break:break-all}
    .log-line.info{color:#94a3b8}
    .log-line.warn{color:#f59e0b}
    .log-line.error{color:#ef4444}
    .log-line.critical{color:#ff0000;font-weight:bold}
    .log-line.signal{color:#22c55e}
    .log-line.trade{color:#93c5fd}
    .svc-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #1e2433;font-size:12px}
    .svc-row:last-child{border-bottom:none}
    .svc-dot{width:8px;height:8px;border-radius:50%;margin-right:8px;display:inline-block;flex-shrink:0}
    .bt-table{width:100%;border-collapse:collapse;font-size:11px}
    .bt-table th{color:#94a3b8;text-align:left;padding:6px 8px;border-bottom:1px solid #1e2433;font-weight:500;font-size:10px;text-transform:uppercase;letter-spacing:.06em}
    .bt-table td{padding:6px 8px;border-bottom:1px solid #111827;color:#cbd5e1}
    .bt-table tr:hover td{background:#151a28}
    .bt-table .good{color:#22c55e}
    .bt-table .bad{color:#ef4444}
    .paper-banner{background:#3b2f0a;border:1px solid #f59e0b44;border-radius:8px;padding:10px 14px;margin-bottom:14px;font-size:12px;color:#fcd34d;display:flex;align-items:center;gap:8px}
    /* ── System alerts ── */
    .sys-alert-bar{margin-bottom:14px;display:flex;flex-direction:column;gap:6px}
    .sys-alert{display:flex;align-items:flex-start;gap:10px;padding:10px 14px;border-radius:8px;font-size:12px}
    .sys-alert.warning{background:#2d2200;border:1px solid #f59e0b55;color:#fcd34d}
    .sys-alert.error{background:#1f0a0a;border:1px solid #ef444455;color:#fca5a5}
    .sys-alert.critical{background:#1a0505;border:2px solid #ef4444;color:#ff6b6b;animation:pulse 2s infinite}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.7}}
    .sys-alert-icon{font-size:16px;flex-shrink:0;margin-top:1px}
    .sys-alert-body{flex:1}
    .sys-alert-title{font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:3px}
    .sys-alert-msg{color:inherit;opacity:.85}
    .sys-alert-meta{font-size:10px;opacity:.55;margin-top:4px}

    /* ── Signal health widget ── */
    .health-banner{border-radius:8px;padding:12px 16px;margin-bottom:14px;display:flex;align-items:flex-start;gap:14px;font-size:12px}
    .health-banner.ok{background:#0d2218;border:1px solid #16653444}
    .health-banner.caution{background:#2d2200;border:1px solid #f59e0b44}
    .health-banner.warning{background:#2a1500;border:1px solid #f9731644}
    .health-banner.critical{background:#1f0505;border:1px solid #ef444444}
    .health-drought{font-size:28px;font-weight:700;font-family:'Courier New',monospace;line-height:1;flex-shrink:0;min-width:48px;text-align:center}
    .health-blocker{background:#0f1117;border-radius:6px;padding:7px 10px;margin-top:6px;font-size:11px}
    .health-blocker .cat{color:#94a3b8;font-weight:500}
    .health-blocker .hint{color:#94a3b8;margin-top:2px}

    /* ── Learning & Commodity tables ── */
    .data-table{width:100%;border-collapse:collapse;font-size:11px}
    .data-table th{color:#94a3b8;text-align:left;padding:6px 8px;border-bottom:1px solid #1e2433;font-weight:500;font-size:10px;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
    .data-table td{padding:6px 8px;border-bottom:1px solid #111827;color:#cbd5e1;vertical-align:middle}
    .data-table tr:hover td{background:#151a28}
    .data-table .good{color:#22c55e}
    .data-table .bad{color:#ef4444}
    .data-table .neutral-cell{color:#94a3b8}
    .data-table .sym{font-family:monospace;color:#f1f5f9;font-weight:600}
    .meta-pill{display:inline-block;padding:1px 6px;border-radius:3px;font-size:10px;background:#1e2433;color:#94a3b8;margin-right:3px;font-family:monospace}
    .outcome-strong_win{color:#22c55e;font-weight:600}
    .outcome-small_win{color:#86efac}
    .outcome-scratch{color:#94a3b8}
    .outcome-small_loss{color:#fca5a5}
    .outcome-large_loss{color:#ef4444;font-weight:600}
    .sub-tabs{display:flex;gap:4px;margin-bottom:14px}
    .sub-tab{padding:4px 12px;border-radius:5px;border:1px solid #2d3748;background:transparent;color:#94a3b8;font-size:12px;cursor:pointer}
    .sub-tab.active{background:#1e293b;color:#f1f5f9;border-color:#334155}
    .source-live{color:#22c55e;font-size:10px}
    .source-sim{color:#f59e0b;font-size:10px}

    /* ── Options chain table ── */
    .chain-wrap{overflow-x:auto}
    .chain-table{width:100%;border-collapse:collapse;font-size:11px;font-family:'Courier New',monospace}
    .chain-table th{color:#94a3b8;padding:5px 8px;text-align:right;font-size:9px;text-transform:uppercase;letter-spacing:.06em;border-bottom:2px solid #1e2433;font-weight:500;white-space:nowrap}
    .chain-table th.ctr{text-align:center}
    .chain-table td{padding:5px 8px;border-bottom:1px solid #111827;text-align:right;color:#cbd5e1;white-space:nowrap}
    .chain-table td.ctr{text-align:center;font-weight:700;color:#f1f5f9;font-size:12px;background:#151a28}
    .chain-table tr.atm td{background:#0e1f35;border-top:1px solid #3b82f633;border-bottom:1px solid #3b82f633}
    .chain-table tr.atm td.ctr{color:#60a5fa;font-size:13px;background:#0a1a2e}
    .chain-table tr:hover td{background:#151a28}
    .chain-table tr.atm:hover td{background:#122540}
    .chain-table tr.atm:hover td.ctr{background:#0d1f35}
    .chain-sym-btn{padding:3px 10px;border-radius:4px;border:1px solid #2d3748;background:transparent;color:#94a3b8;font-size:11px;cursor:pointer;margin-right:4px;font-family:'Courier New',monospace;transition:all .1s}
    .chain-sym-btn.active{border-color:#3b82f6;background:#1e3a5f;color:#93c5fd}

    /* ── Daily Journal ── */
    .journal-session{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:16px}
    .journal-sym-card{background:#151a28;border-radius:8px;padding:12px 14px;margin-bottom:8px;border-left:3px solid #334155}
    .journal-sym-card.traded{border-color:#22c55e}
    .journal-sym-card.paper_traded{border-color:#f59e0b}
    .journal-sym-card.vetoed{border-color:#ef4444}
    .journal-sym-card.risk_rejected{border-color:#f97316}
    .journal-sym-card.signal_generated{border-color:#3b82f6}
    .journal-sym-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
    .journal-sym-name{font-family:'Courier New',monospace;font-weight:700;font-size:13px;color:#f1f5f9}
    .journal-outcome-badge{padding:2px 8px;border-radius:4px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
    .outcome-traded{background:#14532d;color:#86efac}
    .outcome-paper_traded{background:#3b2f0a;color:#fcd34d}
    .outcome-vetoed{background:#450a0a;color:#fca5a5}
    .outcome-risk_rejected{background:#431407;color:#fdba74}
    .outcome-signal_generated{background:#1e3a5f;color:#93c5fd}
    .journal-reason{font-size:11px;color:#94a3b8;margin-top:3px;line-height:1.4}
    .journal-events{margin-top:8px;border-left:1px solid #1e2433;padding-left:10px}
    .journal-event{display:flex;gap:8px;font-size:10px;padding:2px 0;color:#94a3b8}
    .journal-event-time{color:#64748b;font-family:monospace;flex-shrink:0;width:58px}
    .journal-event-type{font-weight:600;flex-shrink:0;width:140px}
    .journal-event-type.SIGNAL_GENERATED{color:#3b82f6}
    .journal-event-type.INTELLIGENCE_VETO{color:#ef4444}
    .journal-event-type.SIGNAL_REJECTED{color:#f97316}
    .journal-event-type.ORDER_PLACED,.journal-event-type.POSITION_OPENED{color:#22c55e}
    .journal-event-type.PAPER_TRADE{color:#f59e0b}
    .journal-event-reason{color:#94a3b8;flex:1}
    .journal-section-hdr{font-size:11px;color:#94a3b8;text-transform:uppercase;letter-spacing:.08em;margin:16px 0 8px;font-weight:500}
    .rejection-pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
    .rejection-pill{background:#1e2433;border-radius:6px;padding:5px 10px;font-size:11px;display:flex;gap:6px;align-items:center}
    .rejection-pill .rp-count{font-weight:700;color:#f1f5f9;font-family:monospace}
    .rejection-pill .rp-label{color:#94a3b8}
    .journal-date-row{display:flex;align-items:center;gap:10px;margin-bottom:14px}
    .journal-date-input{background:#151a28;border:1px solid #2d3748;border-radius:6px;color:#e2e8f0;padding:5px 10px;font-size:12px;outline:none}
    /* ── Conviction Score Card ── */
    .conviction-card{background:#0f1420;border-radius:10px;padding:14px 16px;margin-bottom:16px;border:1px solid #1e2433}
    .conviction-header{display:flex;align-items:center;gap:16px;margin-bottom:12px}
    .conviction-score-big{font-size:32px;font-weight:800;font-family:'Courier New',monospace;line-height:1}
    .conviction-score-big.bullish{color:#22c55e}.conviction-score-big.bearish{color:#ef4444}.conviction-score-big.neutral{color:#f59e0b}
    .conviction-meta{flex:1}
    .conviction-direction{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
    .conviction-direction.bullish{color:#22c55e}.conviction-direction.bearish{color:#ef4444}.conviction-direction.neutral{color:#f59e0b}
    .conviction-tradeable{font-size:10px;margin-top:2px}
    .conviction-timestamp{font-size:10px;color:#64748b;margin-top:1px}
    .conviction-signals{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
    .conviction-signal{background:#151a28;border-radius:6px;padding:8px 10px}
    .conviction-signal-label{font-size:9px;color:#94a3b8;text-transform:uppercase;letter-spacing:.07em;margin-bottom:3px}
    .conviction-signal-row{display:flex;align-items:baseline;gap:6px}
    .conviction-signal-score{font-family:monospace;font-weight:800;font-size:14px}
    .conviction-signal-score.pos{color:#22c55e}.conviction-signal-score.neg{color:#ef4444}.conviction-signal-score.zero{color:#64748b}
    .conviction-signal-reason{font-size:10px;color:#94a3b8;margin-top:2px;line-height:1.35}
    .journal-filter-btns{display:flex;gap:4px;flex-wrap:wrap}
    .journal-filter-btn{padding:3px 10px;border-radius:5px;border:1px solid #2d3748;background:transparent;color:#94a3b8;font-size:11px;cursor:pointer}
    .journal-filter-btn.active{background:#1e293b;color:#f1f5f9;border-color:#334155}
    .journal-trade-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #111827;font-size:12px}
    .journal-trade-row:last-child{border-bottom:none}
    .journal-empty{color:#64748b;font-size:12px;text-align:center;padding:28px 0}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const API      = "http://140.245.26.69:8000";
const WS       = "ws://140.245.26.69:8000/ws/live";
const WS_LOGS  = "ws://140.245.26.69:8000/ws/logs";

/* ── helpers ── */
const fmt = n => (n||0).toLocaleString("en-IN",{maximumFractionDigits:0});
const fmtR = r => {
  const v = (r||0).toFixed(2);
  return (r>=0 ? "+" : "") + v + "R";
};
const droughtColor = s => ({OK:"#22c55e",CAUTION:"#f59e0b",WARNING:"#f97316",CRITICAL:"#ef4444"}[s]||"#94a3b8");
const outcomeLabel = b => ({strong_win:"Strong Win",small_win:"Small Win",scratch:"Scratch",small_loss:"Small Loss",large_loss:"Large Loss"}[b]||b);

/* ─────────────────────────────────────────────────────────────
   LearningTradesTable — standalone component.
   Filter/sort state lives HERE, not in App, so App re-renders
   (from the 2 s WS tick) never unmount this component or steal
   focus from a date picker / text input.
   React.memo prevents re-renders unless the trades array changes.
───────────────────────────────────────────────────────────── */
const LearningTradesTable = React.memo(function LearningTradesTable({trades, ltps={}, showControls}) {
  const [filterSym,    setFilterSym]    = React.useState("");
  const [filterStrat,  setFilterStrat]  = React.useState("all");
  const [filterDir,    setFilterDir]    = React.useState("all");
  const [filterStatus, setFilterStatus] = React.useState("all");
  const [filterDate,   setFilterDate]   = React.useState("");
  const [sortCol,      setSortCol]      = React.useState("entry_time");
  const [sortAsc,      setSortAsc]      = React.useState(false);

  if (!trades || !trades.length) return <div className="empty">No learning trades yet</div>;

  const strategies = ["all", ...Array.from(new Set(trades.map(t=>t.strategy).filter(Boolean)))];

  let rows = trades.filter(t => {
    const sym = (t.symbol||"").replace("NSE:","").replace("-EQ","").replace("MCX:","");
    if (filterSym    && !sym.toLowerCase().includes(filterSym.toLowerCase())) return false;
    if (filterStrat  !== "all" && t.strategy !== filterStrat) return false;
    if (filterDir    !== "all" && t.direction !== filterDir)  return false;
    if (filterStatus !== "all" && t.status    !== filterStatus) return false;
    if (filterDate) {
      const d = (t.entry_time||"").slice(0,10);
      if (d !== filterDate) return false;
    }
    return true;
  });

  const numCols = new Set(["entry_price","exit_price","stop_loss","target","pnl_pts","pnl_r","mae_pts","mfe_pts"]);
  rows = [...rows].sort((a, b) => {
    let va = a[sortCol] ?? "", vb = b[sortCol] ?? "";
    if (numCols.has(sortCol)) { va = Number(va)||0; vb = Number(vb)||0; }
    else { va = String(va); vb = String(vb); }
    if (va < vb) return sortAsc ? -1 : 1;
    if (va > vb) return sortAsc ?  1 : -1;
    return 0;
  });

  function SortTh({col, label}) {
    const active = sortCol === col;
    return (
      <th style={{cursor:"pointer",userSelect:"none",whiteSpace:"nowrap"}}
          onClick={()=>{ if(active) setSortAsc(p=>!p); else { setSortCol(col); setSortAsc(true); } }}>
        {label} {active ? (sortAsc ? "↑" : "↓") : <span style={{opacity:0.3}}>↕</span>}
      </th>
    );
  }

  const inputStyle = {
    background:"#0f1623", border:"1px solid #1e2433", borderRadius:4,
    color:"#e2e8f0", padding:"3px 7px", fontSize:11
  };

  return (
    <div>
      {showControls !== false && (
        <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:10,alignItems:"center"}}>
          <input
            type="text" placeholder="Symbol…" value={filterSym}
            onChange={e=>setFilterSym(e.target.value)}
            style={{...inputStyle, width:110}}
          />
          <select value={filterStrat} onChange={e=>setFilterStrat(e.target.value)} style={inputStyle}>
            {strategies.map(s=><option key={s} value={s}>{s==="all"?"All strategies":s}</option>)}
          </select>
          <select value={filterDir} onChange={e=>setFilterDir(e.target.value)} style={inputStyle}>
            <option value="all">All dirs</option>
            <option value="LONG">LONG</option>
            <option value="SHORT">SHORT</option>
          </select>
          <select value={filterStatus} onChange={e=>setFilterStatus(e.target.value)} style={inputStyle}>
            <option value="all">All status</option>
            <option value="OPEN">OPEN</option>
            <option value="CLOSED">CLOSED</option>
          </select>
          <input
            type="date" value={filterDate}
            onChange={e=>setFilterDate(e.target.value)}
            style={{...inputStyle, colorScheme:"dark"}}
          />
          {(filterSym||filterStrat!=="all"||filterDir!=="all"||filterStatus!=="all"||filterDate) && (
            <button style={{...inputStyle,cursor:"pointer",color:"#f59e0b"}}
              onClick={()=>{setFilterSym("");setFilterStrat("all");setFilterDir("all");setFilterStatus("all");setFilterDate("");}}>
              ✕ Clear
            </button>
          )}
          <span style={{marginLeft:"auto",color:"#64748b",fontSize:11}}>{rows.length} / {trades.length} rows</span>
        </div>
      )}
      <div style={{overflowX:"auto"}}>
        <table className="data-table">
          <thead>
            <tr>
              <SortTh col="symbol"      label="Symbol"/>
              <SortTh col="direction"   label="Dir"/>
              <SortTh col="entry_time"  label="Date"/>
              <SortTh col="entry_price" label="Entry"/>
              <th style={{whiteSpace:"nowrap",color:"#f59e0b"}}>LTP</th>
              <SortTh col="exit_price"  label="Exit"/>
              <SortTh col="stop_loss"   label="SL"/>
              <SortTh col="target"      label="Target"/>
              <SortTh col="pnl_pts"     label="Pts"/>
              <SortTh col="pnl_r"       label="P&L (R)"/>
              <SortTh col="mae_pts"     label="MAE"/>
              <SortTh col="mfe_pts"     label="MFE"/>
              <SortTh col="exit_reason" label="Reason"/>
              <SortTh col="status"      label="Status"/>
            </tr>
          </thead>
          <tbody>
            {rows.map(t=>{
              const r        = t.pnl_r||0;
              const pts      = t.pnl_pts||0;
              const open     = t.status==="OPEN";
              const dateStr  = (t.entry_time||"").slice(0,10);
              const meta     = t.metadata || {};
              const nfoSym   = meta.nfo_symbol || null;
              const isOpts   = meta.instrument_type === "nse_options";
              // Options: ONLY use nfo_symbol key — never fall back to index symbol (avoids index LTP)
              const ltp      = open ? (isOpts ? (nfoSym ? (ltps[nfoSym] || null) : null) : (ltps[t.symbol] || null)) : null;
              const livePts  = ltp != null
                ? (isOpts || t.direction==="LONG" ? ltp - t.entry_price : t.entry_price - ltp)
                : null;
              const ltpColor = ltp == null ? "#64748b"
                : livePts > 0 ? "#22c55e"
                : livePts < 0 ? "#ef4444"
                : "#94a3b8";
              const dispSym  = (nfoSym || t.symbol || "").replace("NSE:","").replace("-EQ","").replace("MCX:","");
              const idxLabel = nfoSym ? (t.symbol||"").replace("NSE:","").replace("-EQ","").replace("MCX:","") : null;
              return (
                <tr key={t.id}>
                  <td className="sym">
                    <span>{dispSym}</span>
                    {idxLabel && <div style={{fontSize:9,color:"#94a3b8",marginTop:1}}>{idxLabel}</div>}
                    {t.strategy && <div style={{marginTop:2}}><span style={{fontSize:9,color:"#93c5fd",fontFamily:"sans-serif",fontWeight:400}}>{t.strategy}</span></div>}
                  </td>
                  <td><span className={`badge ${(t.direction||"").toLowerCase()}`}>{t.direction}</span></td>
                  <td style={{color:"#94a3b8",fontSize:10}}>{dateStr}</td>
                  <td style={{fontFamily:"monospace"}}>{(t.entry_price||0).toFixed(2)}</td>
                  <td style={{fontFamily:"monospace",color:ltpColor,fontWeight:open?"600":"400"}}>
                    {ltp != null ? ltp.toFixed(2) : "—"}
                  </td>
                  <td style={{fontFamily:"monospace"}}>{t.exit_price ? t.exit_price.toFixed(2) : "—"}</td>
                  <td style={{fontFamily:"monospace",color:"#fca5a5"}}>
                    {(t.stop_loss||0).toFixed(2)}
                    {t.entry_price&&t.stop_loss?<div style={{fontSize:9,color:"#9f1239"}}>{((t.stop_loss-t.entry_price)/t.entry_price*100).toFixed(1)}%</div>:null}
                  </td>
                  <td style={{fontFamily:"monospace",color:"#86efac"}}>
                    {(t.target||0).toFixed(2)}
                    {t.entry_price&&t.target?<div style={{fontSize:9,color:"#166534"}}>{((t.target-t.entry_price)/t.entry_price*100)>=0?"+":""}{((t.target-t.entry_price)/t.entry_price*100).toFixed(1)}%</div>:null}
                  </td>
                  <td className={open?(livePts==null?"neutral-cell":livePts>0?"good":livePts<0?"bad":"neutral-cell"):pts>0?"good":pts<0?"bad":"neutral-cell"} style={{fontFamily:"monospace"}}>
                    {open
                      ? (livePts != null ? `${livePts>=0?"+":""}${livePts.toFixed(2)}` : "—")
                      : `${pts>=0?"+":""}${pts.toFixed(2)}`}
                  </td>
                  <td className={open?"neutral-cell":r>0?"good":r<0?"bad":"neutral-cell"} style={{fontFamily:"monospace",fontWeight:600}}>{open?"open":fmtR(r)}</td>
                  <td style={{fontFamily:"monospace",color:"#fca5a5",fontSize:10}}>{(t.mae_pts||0)>0?`-${(t.mae_pts||0).toFixed(2)}`:"—"}</td>
                  <td style={{fontFamily:"monospace",color:"#86efac",fontSize:10}}>{(t.mfe_pts||0)>0?`+${(t.mfe_pts||0).toFixed(2)}`:"—"}</td>
                  <td style={{color:"#94a3b8",fontSize:10}}>{t.exit_reason||"—"}</td>
                  <td><span className={`badge ${open?"manual":"ok"}`} style={{fontSize:9}}>{t.status}</span></td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
});

/* ── Learning review by outcome (standalone — derives groups from trades prop) ── */
const LearningReviewView = React.memo(function LearningReviewView({trades}) {
  if (!trades) return <div className="empty">Loading...</div>;
  const closed = trades.filter(t=>t.status==="CLOSED");

  function bucket(r) {
    if (r >= 2.0)  return "strong_win";
    if (r > 0)     return "small_win";
    if (r >= -0.5) return "scratch";
    if (r >= -1.0) return "small_loss";
    return "large_loss";
  }

  const buckets = ["strong_win","small_win","scratch","small_loss","large_loss"];
  const byOutcome = {};
  for (const t of closed) {
    const b = bucket(t.pnl_r||0);
    if (!byOutcome[b]) byOutcome[b] = [];
    byOutcome[b].push(t);
  }

  return (
    <div>
      {buckets.map(b => {
        const bTrades = byOutcome[b] || [];
        if (!bTrades.length) return null;
        return (
          <div key={b} style={{marginBottom:16}}>
            <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:8}}>
              <span className={`outcome-${b}`} style={{fontWeight:600,fontSize:13}}>{outcomeLabel(b)}</span>
              <span style={{color:"#64748b",fontSize:11}}>{bTrades.length} trade{bTrades.length!==1?"s":""}</span>
            </div>
            <LearningTradesTable trades={bTrades.slice(0,10)} showControls={false}/>
          </div>
        );
      })}
      {!closed.length && <div className="empty">No closed trades to review yet</div>}
    </div>
  );
});

/* ─────────────────────────────────────────────────────────────
   Helpers used by both tab components
───────────────────────────────────────────────────────────── */
function round2(v) { return Math.round(v*100)/100; }

const STRAT_COLOR = {
  "TrendSpread":          "#3b82f6",
  "RSIReversalSpread":    "#a855f7",
  "BreakoutSpread":       "#f97316",
  "CommodityDebitSpread": "#64748b",
};
function StratBadge({name}) {
  const c = STRAT_COLOR[name] || "#64748b";
  return <span style={{background:c+"22",color:c,border:`1px solid ${c}44`,borderRadius:3,padding:"1px 5px",fontSize:9,fontWeight:600,whiteSpace:"nowrap"}}>{name||"—"}</span>;
}

// Static MCX strategy risk/priority metadata — mirrors MCX_STRATEGY_CONFIG in backend
const MCX_RISK_META = {
  "TrendSpread":       { priority:1, risk:"MEDIUM", risk_color:"#f59e0b", risk_label:"Trend-following EMA crossover — well-defined conditions" },
  "RSIReversalSpread": { priority:2, risk:"HIGH",   risk_color:"#f97316", risk_label:"Counter-trend reversal — may catch a falling knife" },
  "BreakoutSpread":    { priority:3, risk:"HIGH",   risk_color:"#ef4444", risk_label:"Price breakout — frequent false signals" },
};

/* ─────────────────────────────────────────────────────────────
   LearningTabContent — owns filter state; stats widgets update
   with the active filter. React.memo shields from 2 s WS ticks.
───────────────────────────────────────────────────────────── */
const LearningTabContent = React.memo(function LearningTabContent({trades, ltps, learnStats}) {
  const [filterSym,    setFilterSym]    = React.useState("");
  const [filterStrat,  setFilterStrat]  = React.useState("all");
  const [filterDir,    setFilterDir]    = React.useState("all");
  const [filterStatus, setFilterStatus] = React.useState("all");
  const [filterDate,   setFilterDate]   = React.useState("");
  const [subTab,       setSubTab]       = React.useState("trades");

  const allTrades  = trades || [];
  const strategies = ["all", ...Array.from(new Set(allTrades.map(t=>t.strategy).filter(Boolean)))];

  const filtered = allTrades.filter(t => {
    const sym = (t.symbol||"").replace("NSE:","").replace("-EQ","").replace("MCX:","");
    if (filterSym    && !sym.toLowerCase().includes(filterSym.toLowerCase())) return false;
    if (filterStrat  !== "all" && t.strategy  !== filterStrat)  return false;
    if (filterDir    !== "all" && t.direction  !== filterDir)    return false;
    if (filterStatus !== "all" && t.status     !== filterStatus) return false;
    if (filterDate   && (t.entry_time||"").slice(0,10) !== filterDate) return false;
    return true;
  });

  const closedF  = filtered.filter(t => t.status === "CLOSED");
  const winnersF = closedF.filter(t => (t.pnl_r||0) > 0);
  const winRateF = closedF.length ? Math.round(winnersF.length / closedF.length * 100) : null;
  const avgRF    = closedF.length ? closedF.reduce((s,t)=>s+(t.pnl_r||0),0)/closedF.length : null;
  const totalRF  = closedF.reduce((s,t)=>s+(t.pnl_r||0), 0);
  const isFiltered = !!(filterSym || filterStrat!=="all" || filterDir!=="all" || filterStatus!=="all" || filterDate);

  const inputStyle = {
    background:"#0f1623", border:"1px solid #1e2433", borderRadius:4,
    color:"#e2e8f0", padding:"3px 7px", fontSize:11
  };

  return (
    <div>
      <div className="paper-banner">
        🎓 Learning paper trades — SimpleRSI &amp; SimpleMomentum on NSE stocks &amp; indices. No real money.
      </div>

      {/* filter bar */}
      <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:12,alignItems:"center"}}>
        <input type="text" placeholder="Symbol…" value={filterSym}
          onChange={e=>setFilterSym(e.target.value)} style={{...inputStyle,width:110}}/>
        <select value={filterStrat} onChange={e=>setFilterStrat(e.target.value)} style={inputStyle}>
          {strategies.map(s=><option key={s} value={s}>{s==="all"?"All strategies":s}</option>)}
        </select>
        <select value={filterDir} onChange={e=>setFilterDir(e.target.value)} style={inputStyle}>
          <option value="all">All dirs</option>
          <option value="LONG">LONG</option>
          <option value="SHORT">SHORT</option>
        </select>
        <select value={filterStatus} onChange={e=>setFilterStatus(e.target.value)} style={inputStyle}>
          <option value="all">All status</option>
          <option value="OPEN">OPEN</option>
          <option value="CLOSED">CLOSED</option>
        </select>
        <input type="date" value={filterDate} onChange={e=>setFilterDate(e.target.value)}
          style={{...inputStyle,colorScheme:"dark"}}/>
        {isFiltered && (
          <button style={{...inputStyle,cursor:"pointer",color:"#f59e0b"}}
            onClick={()=>{setFilterSym("");setFilterStrat("all");setFilterDir("all");setFilterStatus("all");setFilterDate("");}}>
            ✕ Clear
          </button>
        )}
        <span style={{marginLeft:"auto",color:"#64748b",fontSize:11}}>
          {isFiltered ? `${filtered.length} / ${allTrades.length} rows` : `${allTrades.length} trades`}
        </span>
      </div>

      {/* stats widgets — live from filtered rows */}
      <div className="grid4" style={{marginBottom:16}}>
        <div className="metric">
          <div className="lbl">Closed{isFiltered?" · filtered":""}</div>
          <div className="val neutral">{closedF.length}</div>
        </div>
        <div className="metric">
          <div className="lbl">Win rate</div>
          <div className={`val ${(winRateF||0)>=50?"up":"down"}`}>{winRateF!==null?winRateF+"%":"—"}</div>
        </div>
        <div className="metric">
          <div className="lbl">Avg R</div>
          <div className={`val ${(avgRF||0)>=0?"up":"down"}`}>
            {avgRF!==null?`${avgRF>=0?"+":""}${avgRF.toFixed(2)}R`:"—"}
          </div>
        </div>
        <div className="metric">
          <div className="lbl">Total R</div>
          <div className={`val ${totalRF>=0?"up":"down"}`}>
            {closedF.length?`${totalRF>=0?"+":""}${totalRF.toFixed(1)}R`:"—"}
          </div>
        </div>
      </div>

      {/* per-strategy breakdown — all-time from server; hidden when filter active */}
      {learnStats?.by_strategy && !isFiltered && (
        <div className="grid2" style={{marginBottom:16}}>
          {Object.entries(learnStats.by_strategy).map(([name, s])=>(
            <div key={name} className="card">
              <h2>{name}</h2>
              <div style={{display:"grid",gap:8}}>
                {[["Trades", s.total, "neutral"],
                  ["Win rate", `${s.win_rate}%`, s.win_rate>=50?"up":"down"],
                  ["Avg R", `${s.avg_r>=0?"+":""}${s.avg_r}R`, s.avg_r>=0?"up":"down"],
                  ["Wins / Losses", `${s.wins} / ${s.total-s.wins}`, "neutral"],
                ].map(([lbl,val,cls])=>(
                  <div key={lbl} style={{display:"flex",justifyContent:"space-between",fontSize:12}}>
                    <span style={{color:"#94a3b8"}}>{lbl}</span>
                    <span className={cls}>{val}</span>
                  </div>
                ))}
              </div>
            </div>
          ))}
        </div>
      )}

      {/* sub-tabs */}
      <div className="sub-tabs">
        {[["trades","All Trades"],["review","Review by Outcome"],["meta","Exit Breakdown"]].map(([id,lbl])=>(
          <button key={id} className={`sub-tab ${subTab===id?"active":""}`} onClick={()=>setSubTab(id)}>{lbl}</button>
        ))}
      </div>

      {subTab==="trades" && (
        <div className="card">
          <h2>
            Trades
            {isFiltered && <span style={{marginLeft:6,fontWeight:400,color:"#f59e0b",fontSize:10,textTransform:"none",letterSpacing:0}}>· filter active</span>}
          </h2>
          <LearningTradesTable trades={filtered} ltps={ltps} showControls={false}/>
        </div>
      )}

      {subTab==="review" && (
        <div className="card">
          <h2>Trades by outcome bucket</h2>
          <LearningReviewView trades={filtered}/>
        </div>
      )}

      {subTab==="meta" && learnStats && (
        <div className="grid2">
          <div className="card">
            <h2>Exit reasons</h2>
            {learnStats.exit_reasons ? Object.entries(learnStats.exit_reasons).sort((a,b)=>b[1]-a[1]).map(([r,n])=>(
              <div key={r} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid #111827",fontSize:12}}>
                <span style={{color:"#94a3b8"}}>{r}</span>
                <span className={r==="TARGET"?"up":r==="STOP"?"down":"neutral"}>{n}</span>
              </div>
            )) : <div className="empty">No data</div>}
          </div>
          <div className="card">
            <h2>Direction split</h2>
            {learnStats.directions ? Object.entries(learnStats.directions).map(([d,n])=>(
              <div key={d} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid #111827",fontSize:12}}>
                <span className={`badge ${d.toLowerCase()}`}>{d}</span>
                <span className="neutral">{n} trades</span>
              </div>
            )) : <div className="empty">No data</div>}
            {learnStats.best_trade_r !== undefined && (
              <div style={{marginTop:12,display:"grid",gap:6}}>
                {[["Best trade",`+${learnStats.best_trade_r}R`,"up"],
                  ["Worst trade",`${learnStats.worst_trade_r}R`,"down"],
                ].map(([lbl,val,cls])=>(
                  <div key={lbl} style={{display:"flex",justifyContent:"space-between",fontSize:12}}>
                    <span style={{color:"#94a3b8"}}>{lbl}</span>
                    <span className={cls} style={{fontFamily:"monospace"}}>{val}</span>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
});

/* ─────────────────────────────────────────────────────────────
   Module-level so React never treats it as a new component type
   on re-renders, preventing the unmount/remount LTP flash.
───────────────────────────────────────────────────────────── */
function CommodityTradesTable({trades: tds, ltps: lps, onManualClose, mcxConfig}) {
  if (!tds || !tds.length) return <div className="empty">No commodity option trades yet — engine runs during MCX hours (09:00–23:30 IST)</div>;
  const SPREAD_DELTA = 0.35;
  const ATM_DELTA    = 0.50;
  return (
    <div style={{overflowX:"auto"}}>
      <table className="data-table">
        <thead>
          <tr>
            <th>Instrument</th>
            <th style={{width:"42px",textAlign:"center"}}>Dir</th>
            <th>Entry</th>
            <th style={{color:"#f59e0b",width:"90px"}}>Spot Now</th>
            <th style={{width:"80px"}}>ATM Prem</th>
            <th>Debit (Cost)</th>
            <th style={{color:"#86efac"}}>Target</th>
            <th style={{color:"#fca5a5"}}>SL</th>
            <th>RR</th>
            <th style={{color:"#94a3b8"}}>RSI</th>
            <th style={{color:"#94a3b8"}}>IV%</th>
            <th>Time</th>
            <th style={{color:"#f59e0b"}}>Live P&L</th>
            <th>P&L (R)</th>
            <th>Exit</th>
            <th>Src</th>
          </tr>
        </thead>
        <tbody>
          {tds.map(t=>{
            const r           = t.pnl_r||0;
            const isOpen      = t.status==="OPEN";
            const lot         = t.lot_size || 1;
            const spotEntry   = t.spot_at_entry||0;
            const ltpEntry    = (lps && isOpen) ? (lps[t.instrument]||null) : null;
            const ltp         = ltpEntry ? ltpEntry.ltp : null;
            const ltpAgeS     = ltpEntry ? ltpEntry.age_s : null;
            // Stale threshold: energy contracts tick frequently; metals can be quiet for 10+ min
            const MCX_ENERGY  = ["CRUDEOIL","NATURALGAS"];
            const staleLimit  = MCX_ENERGY.includes(t.instrument) ? 180 : 600;
            // Suppress stale warning outside MCX trading hours (09:00–23:30 IST)
            const nowH = new Date().getUTCHours() * 60 + new Date().getUTCMinutes() + 330; // approx IST
            const istMin = nowH % 1440;
            const mcxOpen = istMin >= 9*60 && istMin < 23*60+30;
            const ltpStale = mcxOpen && ltpAgeS != null && ltpAgeS > staleLimit;
            const spotMove    = ltp != null ? (t.direction==="LONG" ? ltp - spotEntry : spotEntry - ltp) : null;
            const estPnlLot   = spotMove != null ? round2(spotMove * SPREAD_DELTA * lot) : null;
            const pnlColor    = estPnlLot == null ? "#64748b" : estPnlLot > 0 ? "#22c55e" : estPnlLot < 0 ? "#ef4444" : "#94a3b8";
            const meta        = t.metadata || {};
            const entryHHMM   = t.entry_time ? t.entry_time.substring(11,16) : "—";
            const rsiColor    = meta.rsi > 60 ? "#f59e0b" : meta.rsi < 40 ? "#93c5fd" : "#94a3b8";
            const optSuffix   = t.opt_type==="call" ? "CE" : "PE";
            const atmPremEntry = meta.atm_prem || 0;
            const atmLiveEst  = (spotMove != null && atmPremEntry > 0)
              ? Math.max(0, round2(atmPremEntry + spotMove * ATM_DELTA))
              : null;
            const slPrice        = meta.sl_price       || null;
            const tgtPct         = meta.target_pct     || 0.50;
            const trailActive    = meta.trail_active   === true;
            const trailTrigSpot  = meta.trail_trig_spot || null;
            // Estimated loss in INR if spot hits the current SL level
            const slMove  = slPrice && spotEntry ? (t.direction==="LONG" ? spotEntry-slPrice : slPrice-spotEntry) : 0;
            const slInr   = round2(Math.max(0, slMove * 0.35 * lot));
            const tgtInr  = round2((t.max_profit||0) * tgtPct * lot);
            // Target spot level: inverse of P&L estimate (tgtInr = move × SPREAD_DELTA × lot)
            const tgtSpot = (tgtInr > 0 && spotEntry)
              ? Math.round(spotEntry + (t.direction==="LONG" ? 1 : -1) * tgtInr / (SPREAD_DELTA * lot))
              : null;
            // How far spot still needs to move before trail kicks in
            const ltp2 = ltp || spotEntry;
            const trailGap = trailTrigSpot && !trailActive
              ? Math.round(Math.abs(trailTrigSpot - ltp2))
              : null;
            return (
              <tr key={t.id}>
                <td className="sym">
                  <span>{(t.instrument||"").replace("MCX:","")}</span>
                  <div style={{fontSize:9,color:"#94a3b8",fontFamily:"monospace",marginTop:2}}>
                    {optSuffix==="CE"?"CALL":"PUT"} SPREAD
                  </div>
                  <div style={{fontSize:9,color:"#60a5fa",fontFamily:"monospace",marginTop:1}}>
                    {t.atm_strike||"?"}{optSuffix} / {t.otm_strike||"?"}{optSuffix}
                  </div>
                  <div style={{marginTop:3}}><StratBadge name={t.strategy}/></div>
                  {(() => {
                    const rm = (mcxConfig?.strategies?.[t.strategy]) || MCX_RISK_META[t.strategy];
                    if (!rm) return null;
                    const rc = rm.risk_color || "#64748b";
                    return (
                      <div style={{marginTop:2}} title={rm.risk_label}>
                        <span style={{fontSize:8,padding:"1px 4px",borderRadius:2,
                          background:rc+"22",color:rc,border:`1px solid ${rc}44`,fontWeight:700}}>
                          {rm.risk==="HIGH" ? "⚠ HIGH RISK" : `● ${rm.risk}`}
                        </span>
                      </div>
                    );
                  })()}
                </td>
                <td style={{textAlign:"center",padding:"0 4px"}}><span className={`badge ${(t.direction||"").toLowerCase()}`}>{t.direction}</span></td>
                <td style={{fontFamily:"monospace",color:"#94a3b8"}}>{spotEntry ? spotEntry.toFixed(0) : "—"}</td>
                <td style={{fontFamily:"monospace"}}>
                  {ltp != null ? (
                    <>
                      <span style={{color: ltpStale ? "#94a3b8" : "#f59e0b",fontWeight:isOpen?"600":"400"}}>{ltp.toFixed(0)}</span>
                      {spotMove != null && (
                        <span style={{fontSize:9,color:pnlColor,marginLeft:4}}>
                          {spotMove>=0?"+":""}{spotMove.toFixed(0)}
                        </span>
                      )}
                      {ltpStale && (
                        <div style={{fontSize:9,color:"#f97316",marginTop:2}}>
                          ⚠ no tick {Math.floor(ltpAgeS/60)}min
                        </div>
                      )}
                      {!mcxOpen && ltpAgeS != null && ltpAgeS > 60 && (
                        <div style={{fontSize:9,color:"#475569",marginTop:2}}>mkt closed</div>
                      )}
                      {!ltpStale && atmLiveEst != null && (
                        <div style={{fontSize:9,color:"#a3e635",marginTop:2}}>~{atmLiveEst.toFixed(1)}</div>
                      )}
                    </>
                  ) : "—"}
                </td>
                <td style={{fontFamily:"monospace",color:"#e2e8f0",whiteSpace:"nowrap"}}>
                  {atmPremEntry > 0 ? atmPremEntry.toFixed(2) : (t.net_debit||0).toFixed(2)}
                  <div style={{fontSize:9,color:"#64748b",marginTop:1}}>{(meta.otm_prem||0).toFixed(2)}</div>
                </td>
                <td style={{fontFamily:"monospace",color:"#fca5a5"}}>
                  {(t.net_debit||0).toFixed(2)} × {lot}
                  <div style={{fontSize:9,color:"#94a3b8",marginTop:1}}>= ₹{round2((t.net_debit||0)*lot).toFixed(0)} cost</div>
                </td>
                {/* ── Target ── */}
                <td style={{fontFamily:"monospace",whiteSpace:"nowrap"}}>
                  <div style={{color:"#86efac",fontWeight:600}}>
                    {tgtSpot ? `@ ${tgtSpot}` : `+₹${tgtInr.toFixed(0)}`}
                    {tgtPct > 0.50 && <span style={{color:"#a3e635",marginLeft:3,fontSize:9}}>↑</span>}
                  </div>
                  <div style={{fontSize:9,color:"#4ade80",marginTop:1}}>+₹{tgtInr.toFixed(0)}</div>
                  <div style={{fontSize:9,color:"#475569",marginTop:2}}>
                    max {t.otm_strike ? `@ ${t.otm_strike}` : `+₹${round2((t.max_profit||0)*lot).toFixed(0)}`}
                  </div>
                </td>
                {/* ── SL ── */}
                <td style={{fontFamily:"monospace",whiteSpace:"nowrap"}}>
                  <div style={{color:"#fca5a5",fontWeight:600}}>
                    {slPrice ? `@ ${Math.round(slPrice)}` : "—"}
                    {trailActive && <span style={{color:"#f97316",marginLeft:4,fontSize:9}}>↑T</span>}
                  </div>
                  {slPrice && <div style={{fontSize:9,color:"#f87171",marginTop:1}}>~-₹{slInr.toFixed(0)}</div>}
                  <div style={{fontSize:8,marginTop:2}}>
                    {trailActive
                      ? <span style={{color:"#f97316"}}>trailing</span>
                      : trailTrigSpot
                        ? <span style={{color:"#475569"}}>trail @ {trailTrigSpot}{trailGap!=null ? ` (${trailGap}↑)` : ""}</span>
                        : null
                    }
                  </div>
                </td>
                <td style={{fontFamily:"monospace"}}>{(t.rr||t.rr_planned||0).toFixed(1)}</td>
                <td style={{fontFamily:"monospace",color:rsiColor,fontSize:10}}>{meta.rsi ? Number(meta.rsi).toFixed(1) : "—"}</td>
                <td style={{fontFamily:"monospace",fontSize:10,color:"#94a3b8"}}>{meta.iv_pct ? meta.iv_pct+"%" : "—"}</td>
                <td style={{fontFamily:"monospace",fontSize:10,color:"#94a3b8"}}>{entryHHMM}</td>
                <td style={{fontFamily:"monospace",fontWeight:600,color:pnlColor}}>
                  {isOpen && estPnlLot != null
                    ? <>
                        <span>{estPnlLot>=0?"+":""}₹{Math.abs(estPnlLot).toFixed(0)}</span>
                        <div style={{fontSize:9,color:"#64748b",marginTop:1}}>spread × {lot} lot</div>
                      </>
                    : !isOpen && t.pnl_approx != null
                      ? <>
                          <span className={t.pnl_approx>=0?"good":"bad"}>{t.pnl_approx>=0?"+":""}₹{Math.abs(t.pnl_approx).toFixed(0)}</span>
                          <div style={{fontSize:9,color:"#64748b",marginTop:1}}>× {lot} lot</div>
                        </>
                      : "—"}
                </td>
                <td className={r>0?"good":r<0?"bad":"neutral-cell"} style={{fontFamily:"monospace",fontWeight:600}}>{isOpen?"open":fmtR(r)}</td>
                <td style={{color:"#94a3b8",fontSize:10}}>
                  {t.exit_reason||"—"}
                  {isOpen && onManualClose && (
                    <div style={{marginTop:4}}>
                      <button
                        onClick={() => {
                          const rm = MCX_RISK_META[t.strategy] || {};
                          if (!window.confirm(
                            `Close ${t.instrument} ${t.direction} spread now?\n\n` +
                            `Exit: MANUAL_CLOSE at current spot.\n` +
                            `Est. P&L: ${estPnlLot!=null?(estPnlLot>=0?"+":"")+"₹"+Math.abs(estPnlLot).toFixed(0):"unknown"}\n\n` +
                            `A ${(mcxConfig?.strategies?.[t.strategy]||rm).cooldown_hours||3}h re-entry cooldown will be applied.`
                          )) return;
                          fetch(`${API}/commodity/trades/${t.id}/close`, {method:"POST"})
                            .then(r=>r.json())
                            .then(d=>{
                              if (d.success) {
                                onManualClose();
                                if (d.cooldown_resume)
                                  console.info(`${d.instrument} cooldown until ${d.cooldown_resume}`);
                              } else alert("Close failed: "+(d.error||"unknown error"));
                            })
                            .catch(()=>alert("Network error — close failed"));
                        }}
                        style={{background:"transparent",border:"1px solid #7f1d1d",color:"#f87171",
                                borderRadius:3,fontSize:9,padding:"2px 7px",cursor:"pointer",lineHeight:"1.4"}}>
                        ✕ Close Now
                      </button>
                    </div>
                  )}
                </td>
                <td><span className={t.data_source==="live_chain"?"source-live":"source-sim"}>{t.data_source==="live_chain"?"●":"◌"}</span></td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
  );
}

/* ─────────────────────────────────────────────────────────────
   InstrumentsPanel — full CRUD for MCX instruments
───────────────────────────────────────────────────────────── */
const BLANK_FORM = {
  name:"", lot_size:"", strike_step:"", typical_iv:"0.30",
  price_unit:"INR/unit", min_price:"", max_price:"",
  rollover_buffer:"5", valid_months:"",
  // SL/target overrides — blank = inherit strategy default
  sl_debit_pct:"", trail_debit_pct:"", trail_trigger_pct:"",
  target_pct:"", target_upgraded_pct:"", target_upgrade_mult:"",
};

function InstrumentsPanel({instruments, trades, instrBusy, setInstrBusy, setInstruments}) {
  const [showAdd,  setShowAdd]  = React.useState(false);
  const [editName, setEditName] = React.useState(null);   // name being edited
  const [form,     setForm]     = React.useState(BLANK_FORM);
  const [formErr,  setFormErr]  = React.useState("");
  const [saving,   setSaving]   = React.useState(false);

  const inputS = {
    background:"#0f1623", border:"1px solid #1e2433", borderRadius:4,
    color:"#e2e8f0", padding:"4px 8px", fontSize:12, width:"100%",
  };
  const labelS = {fontSize:11, color:"#64748b", marginBottom:3, display:"block"};

  function reloadInstruments() {
    fetch(`${API}/commodity/instruments`).then(r=>r.json())
      .then(d=>{ if(d.instruments) setInstruments(d.instruments); })
      .catch(()=>{});
  }

  function openAdd() {
    setForm(BLANK_FORM); setFormErr(""); setEditName(null); setShowAdd(true);
  }

  function openEdit(ins) {
    const fmtOv = v => (v == null ? "" : String(v));
    setForm({
      name:            ins.name,
      lot_size:        String(ins.lot_size),
      strike_step:     String(ins.strike_step),
      typical_iv:      String(ins.typical_iv),
      price_unit:      ins.price_unit,
      min_price:       String(ins.min_price),
      max_price:       String(ins.max_price),
      rollover_buffer: String(ins.rollover_buffer),
      valid_months:    (ins.valid_months||[]).join(","),
      sl_debit_pct:         fmtOv(ins.sl_debit_pct),
      trail_debit_pct:      fmtOv(ins.trail_debit_pct),
      trail_trigger_pct:    fmtOv(ins.trail_trigger_pct),
      target_pct:           fmtOv(ins.target_pct),
      target_upgraded_pct:  fmtOv(ins.target_upgraded_pct),
      target_upgrade_mult:  fmtOv(ins.target_upgrade_mult),
    });
    setFormErr(""); setEditName(ins.name); setShowAdd(true);
  }

  function closeForm() { setShowAdd(false); setEditName(null); setFormErr(""); }

  function parseMonths(s) {
    if(!s.trim()) return [];
    return s.split(",").map(x=>parseInt(x.trim())).filter(n=>n>=1&&n<=12);
  }

  function submitForm() {
    const vm = parseMonths(form.valid_months);
    const parseOv = (s) => s.trim() === "" ? null : parseFloat(s);
    const payload = {
      lot_size:        parseInt(form.lot_size),
      strike_step:     parseFloat(form.strike_step),
      typical_iv:      parseFloat(form.typical_iv),
      price_unit:      form.price_unit.trim(),
      min_price:       parseFloat(form.min_price),
      max_price:       parseFloat(form.max_price),
      rollover_buffer: parseInt(form.rollover_buffer),
      valid_months:    vm,
      // SL/target overrides — null means "clear override, use strategy default"
      sl_debit_pct:        parseOv(form.sl_debit_pct),
      trail_debit_pct:     parseOv(form.trail_debit_pct),
      trail_trigger_pct:   parseOv(form.trail_trigger_pct),
      target_pct:          parseOv(form.target_pct),
      target_upgraded_pct: parseOv(form.target_upgraded_pct),
      target_upgrade_mult: parseOv(form.target_upgrade_mult),
    };
    if(!form.name.trim())               return setFormErr("Name is required");
    if(isNaN(payload.lot_size)||payload.lot_size<=0)    return setFormErr("Lot size must be a positive integer");
    if(isNaN(payload.strike_step)||payload.strike_step<=0) return setFormErr("Strike step must be positive");
    if(isNaN(payload.min_price)||isNaN(payload.max_price)||payload.min_price>=payload.max_price)
                                         return setFormErr("min_price must be less than max_price");
    setSaving(true); setFormErr("");
    const isEdit = !!editName;
    const req = isEdit
      ? fetch(`${API}/commodity/instruments/${editName}`, {
          method:"PUT", headers:{"Content-Type":"application/json"},
          body: JSON.stringify(payload),
        })
      : fetch(`${API}/commodity/instruments`, {
          method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({name: form.name.toUpperCase().trim(), ...payload}),
        });
    req.then(r=>r.json()).then(d=>{
      if(d.status==="ok") { reloadInstruments(); closeForm(); }
      else setFormErr(d.error || "Failed");
    }).catch(e=>setFormErr(String(e))).finally(()=>setSaving(false));
  }

  function toggleEnable(ins) {
    const action = ins.enabled ? "disable" : "enable";
    if(ins.enabled && !window.confirm(
      `Disable ${ins.name}?\n\nNo new entries will be taken.\nOpen positions continue to be monitored.`
    )) return;
    setInstrBusy(b=>({...b,[ins.name]:true}));
    fetch(`${API}/commodity/instruments/${ins.name}/${action}`, {method:"POST"})
      .then(r=>r.json())
      .then(d=>{
        if(d.status==="ok") setInstruments(prev=>prev.map(i=>i.name===ins.name?{...i,enabled:!ins.enabled}:i));
        else alert(d.error||"Failed");
      })
      .finally(()=>setInstrBusy(b=>({...b,[ins.name]:false})));
  }

  function removeInstrument(ins) {
    if(!window.confirm(
      `Remove ${ins.name} from the instruments list?\n\nTrade history is kept.\nThis cannot be undone easily.`
    )) return;
    setInstrBusy(b=>({...b,[ins.name]:true}));
    fetch(`${API}/commodity/instruments/${ins.name}`, {method:"DELETE"})
      .then(r=>r.json())
      .then(d=>{
        if(d.status==="ok") reloadInstruments();
        else alert(d.error||"Failed");
      })
      .finally(()=>setInstrBusy(b=>({...b,[ins.name]:false})));
  }

  return (
    <div>
      <div className="card" style={{marginBottom:12}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <h2 style={{margin:0}}>Instruments
            <span style={{marginLeft:8,fontWeight:400,color:"#64748b",fontSize:10,textTransform:"none",letterSpacing:0}}>
              stored in DB · changes take effect immediately · restarts preserved
            </span>
          </h2>
          <button className="mode-btn"
            style={{background:"#1e3a5f",borderColor:"#1e40af",color:"#93c5fd",fontWeight:600}}
            onClick={openAdd}>
            + Add Instrument
          </button>
        </div>

        {/* Add / Edit form */}
        {showAdd && (
          <div style={{background:"#0a1220",border:"1px solid #1e2d45",borderRadius:8,padding:16,marginBottom:16}}>
            <div style={{fontWeight:600,fontSize:13,color:"#e2e8f0",marginBottom:12}}>
              {editName ? `Edit — ${editName}` : "Add New Instrument"}
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(160px,1fr))",gap:10,marginBottom:12}}>
              {!editName && (
                <div>
                  <label style={labelS}>Name (e.g. GOLDMINI)</label>
                  <input style={inputS} value={form.name}
                    onChange={e=>setForm(f=>({...f,name:e.target.value.toUpperCase()}))}
                    placeholder="GOLDMINI"/>
                </div>
              )}
              <div>
                <label style={labelS}>Lot size</label>
                <input style={inputS} type="number" value={form.lot_size}
                  onChange={e=>setForm(f=>({...f,lot_size:e.target.value}))} placeholder="100"/>
              </div>
              <div>
                <label style={labelS}>Strike step</label>
                <input style={inputS} type="number" value={form.strike_step}
                  onChange={e=>setForm(f=>({...f,strike_step:e.target.value}))} placeholder="100"/>
              </div>
              <div>
                <label style={labelS}>Typical IV (e.g. 0.30)</label>
                <input style={inputS} type="number" step="0.01" value={form.typical_iv}
                  onChange={e=>setForm(f=>({...f,typical_iv:e.target.value}))}/>
              </div>
              <div>
                <label style={labelS}>Price unit (e.g. INR/kg)</label>
                <input style={inputS} value={form.price_unit}
                  onChange={e=>setForm(f=>({...f,price_unit:e.target.value}))}/>
              </div>
              <div>
                <label style={labelS}>Min price</label>
                <input style={inputS} type="number" value={form.min_price}
                  onChange={e=>setForm(f=>({...f,min_price:e.target.value}))} placeholder="3000"/>
              </div>
              <div>
                <label style={labelS}>Max price</label>
                <input style={inputS} type="number" value={form.max_price}
                  onChange={e=>setForm(f=>({...f,max_price:e.target.value}))} placeholder="12000"/>
              </div>
              <div>
                <label style={labelS}>Rollover buffer (days)</label>
                <input style={inputS} type="number" value={form.rollover_buffer}
                  onChange={e=>setForm(f=>({...f,rollover_buffer:e.target.value}))}/>
              </div>
              <div>
                <label style={labelS}>Valid months (blank=all, e.g. 3,5,7,9,12)</label>
                <input style={inputS} value={form.valid_months}
                  onChange={e=>setForm(f=>({...f,valid_months:e.target.value}))}
                  placeholder="3,5,7,9,12 or blank"/>
              </div>
            </div>

            {/* Per-instrument risk overrides */}
            <div style={{borderTop:"1px solid #1e2d45",paddingTop:10,marginBottom:10}}>
              <div style={{fontSize:11,color:"#64748b",marginBottom:8,fontWeight:600}}>
                Risk Overrides
                <span style={{fontWeight:400,marginLeft:6}}>— blank = use strategy default</span>
              </div>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(160px,1fr))",gap:10}}>
                <div>
                  <label style={labelS}>Initial SL % of Debit <span style={{color:"#334155"}}>(def 0.40)</span></label>
                  <input style={inputS} type="number" step="0.01" min="0.05" max="1"
                    value={form.sl_debit_pct}
                    onChange={e=>setForm(f=>({...f,sl_debit_pct:e.target.value}))}
                    placeholder="e.g. 0.55 for Silver"/>
                </div>
                <div>
                  <label style={labelS}>Trail Distance % of Debit <span style={{color:"#334155"}}>(def 0.30)</span></label>
                  <input style={inputS} type="number" step="0.01" min="0.05" max="1"
                    value={form.trail_debit_pct}
                    onChange={e=>setForm(f=>({...f,trail_debit_pct:e.target.value}))}
                    placeholder="e.g. 0.20"/>
                </div>
                <div>
                  <label style={labelS}>Trail Trigger % of SL Dist <span style={{color:"#334155"}}>(def 0.50)</span></label>
                  <input style={inputS} type="number" step="0.01" min="0.1" max="1"
                    value={form.trail_trigger_pct}
                    onChange={e=>setForm(f=>({...f,trail_trigger_pct:e.target.value}))}
                    placeholder="e.g. 0.40"/>
                </div>
                <div>
                  <label style={labelS}>Initial Target % of Max Profit <span style={{color:"#334155"}}>(def 0.50)</span></label>
                  <input style={inputS} type="number" step="0.01" min="0.1" max="1"
                    value={form.target_pct}
                    onChange={e=>setForm(f=>({...f,target_pct:e.target.value}))}
                    placeholder="e.g. 0.45"/>
                </div>
                <div>
                  <label style={labelS}>Upgraded Target % <span style={{color:"#334155"}}>(def 0.75)</span></label>
                  <input style={inputS} type="number" step="0.01" min="0.1" max="1"
                    value={form.target_upgraded_pct}
                    onChange={e=>setForm(f=>({...f,target_upgraded_pct:e.target.value}))}
                    placeholder="e.g. 0.70"/>
                </div>
                <div>
                  <label style={labelS}>Target Upgrade Multiplier <span style={{color:"#334155"}}>(def 2.0)</span></label>
                  <input style={inputS} type="number" step="0.1" min="0.5" max="5"
                    value={form.target_upgrade_mult}
                    onChange={e=>setForm(f=>({...f,target_upgrade_mult:e.target.value}))}
                    placeholder="e.g. 1.5"/>
                </div>
              </div>
            </div>

            {formErr && <div style={{color:"#fca5a5",fontSize:11,marginBottom:8}}>⚠ {formErr}</div>}
            <div style={{display:"flex",gap:8}}>
              <button className="mode-btn" disabled={saving} onClick={submitForm}
                style={{background:"#14532d",borderColor:"#15803d",color:"#86efac",fontWeight:600}}>
                {saving ? "Saving…" : editName ? "Update" : "Add"}
              </button>
              <button className="mode-btn" onClick={closeForm}>Cancel</button>
            </div>
          </div>
        )}

        {/* Instrument cards */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(270px,1fr))",gap:10}}>
          {instruments.map(ins => {
            const busy    = instrBusy[ins.name];
            const hasOpen = (trades||[]).some(t=>t.instrument===ins.name&&t.status==="OPEN");
            return (
              <div key={ins.name} style={{
                background:"#0f1623",
                border:`1px solid ${ins.enabled?"#1a3a2a":"#2a1a1a"}`,
                borderRadius:8, padding:"12px 14px",
              }}>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:6}}>
                  <span style={{
                    fontFamily:"'Courier New',monospace",fontWeight:700,fontSize:13,flex:1,
                    color: ins.enabled ? "#e2e8f0" : "#475569",
                  }}>{ins.name}</span>
                  {ins.enabled
                    ? <span className="badge auto">ACTIVE</span>
                    : <span className="badge" style={{background:"#1e293b",color:"#475569"}}>OFF</span>
                  }
                  {hasOpen && <span className="badge" style={{background:"#1c3f1a",color:"#86efac",fontSize:9}}>OPEN</span>}
                </div>
                <div style={{fontSize:11,color:"#64748b",marginBottom:10,lineHeight:1.7}}>
                  <div>Lot <strong style={{color:"#94a3b8"}}>{ins.lot_size}</strong> · Step <strong style={{color:"#94a3b8"}}>{ins.strike_step}</strong> · IV <strong style={{color:"#94a3b8"}}>{(ins.typical_iv*100).toFixed(0)}%</strong></div>
                  <div>{ins.price_unit} · {ins.min_price.toLocaleString()}–{ins.max_price.toLocaleString()}</div>
                  {ins.valid_months?.length>0 && <div>Months: {ins.valid_months.join(", ")}</div>}
                  {/* Show per-instrument risk overrides if any are set */}
                  {(ins.sl_debit_pct!=null||ins.trail_debit_pct!=null||ins.target_pct!=null) && (
                    <div style={{marginTop:4,padding:"3px 6px",background:"#0c1a2e",borderRadius:4,fontSize:10,color:"#7dd3fc",lineHeight:1.8}}>
                      {ins.sl_debit_pct!=null && <span style={{marginRight:8}}>SL {(ins.sl_debit_pct*100).toFixed(0)}%</span>}
                      {ins.trail_debit_pct!=null && <span style={{marginRight:8}}>Trail {(ins.trail_debit_pct*100).toFixed(0)}%</span>}
                      {ins.trail_trigger_pct!=null && <span style={{marginRight:8}}>Trig {(ins.trail_trigger_pct*100).toFixed(0)}%</span>}
                      {ins.target_pct!=null && <span style={{marginRight:8}}>T1 {(ins.target_pct*100).toFixed(0)}%</span>}
                      {ins.target_upgraded_pct!=null && <span style={{marginRight:8}}>T2 {(ins.target_upgraded_pct*100).toFixed(0)}%</span>}
                      {ins.target_upgrade_mult!=null && <span>×{ins.target_upgrade_mult}</span>}
                    </div>
                  )}
                  <div style={{fontFamily:"monospace",fontSize:10,color:"#334155",marginTop:2}}>{ins.symbol}</div>
                </div>
                <div style={{display:"flex",gap:5}}>
                  <button className="mode-btn" disabled={busy}
                    style={{flex:1,
                      background: ins.enabled ? "#450a0a" : "#14532d",
                      borderColor: ins.enabled ? "#7f1d1d" : "#15803d",
                      color: ins.enabled ? "#fca5a5" : "#86efac",
                      opacity: (ins.enabled&&hasOpen) ? 0.5 : 1,
                      cursor: (ins.enabled&&hasOpen) ? "not-allowed" : "pointer",
                      fontWeight:600,
                    }}
                    title={ins.enabled&&hasOpen?"Close open position first":""}
                    onClick={()=>!(ins.enabled&&hasOpen)&&toggleEnable(ins)}>
                    {busy ? "…" : ins.enabled ? "Disable" : "Enable"}
                  </button>
                  <button className="mode-btn" disabled={busy}
                    title="Edit parameters"
                    onClick={()=>openEdit(ins)}>
                    ✎
                  </button>
                  <button className="mode-btn" disabled={busy||hasOpen}
                    title={hasOpen?"Close position first":"Remove instrument"}
                    style={{color:"#fca5a5",opacity:hasOpen?0.4:1,cursor:hasOpen?"not-allowed":"pointer"}}
                    onClick={()=>!hasOpen&&removeInstrument(ins)}>
                    ✕
                  </button>
                </div>
              </div>
            );
          })}
        </div>
        {instruments.length===0 && <div className="empty">No instruments — loading or none added yet.</div>}
      </div>
    </div>
  );
}

/* ─────────────────────────────────────────────────────────────
   CommodityTabContent — owns filter state + options chain state.
   Stats widgets and table rows both update with the active filter.
───────────────────────────────────────────────────────────── */
function CommodityTabContent({trades, ltps, commStats, onManualClose, mcxConfig, commMode, commModeBusy, onModeToggle}) {
  const [filterSym,    setFilterSym]    = React.useState("");
  const [filterStrat,  setFilterStrat]  = React.useState("all");
  const [filterStatus, setFilterStatus] = React.useState("all");
  const [filterDate,   setFilterDate]   = React.useState("");
  const [subTab,       setSubTab]       = React.useState("trades");

  const [commChain,       setCommChain]       = React.useState(null);
  const [commChainSym,    setCommChainSym]    = React.useState("CRUDEOIL");
  const [commChainExpIdx, setCommChainExpIdx] = React.useState(0);
  const [commChainBusy,   setCommChainBusy]   = React.useState(false);

  const [instruments,     setInstruments]     = React.useState([]);
  const [instrBusy,       setInstrBusy]       = React.useState({});

  React.useEffect(() => {
    fetch(`${API}/commodity/instruments`).then(r=>r.json())
      .then(d=>{ if(d.instruments) setInstruments(d.instruments); })
      .catch(()=>{});
  }, []);

  React.useEffect(() => {
    if (subTab !== "chain") return;
    setCommChainBusy(true);
    fetch(`${API}/commodity/chain-full/${commChainSym}?expiry_idx=${commChainExpIdx}`)
      .then(r => r.json())
      .then(d => { setCommChain(d); setCommChainBusy(false); })
      .catch(() => setCommChainBusy(false));
  }, [subTab, commChainSym, commChainExpIdx]);

  const allTrades  = trades || [];
  const strategies = ["all", ...Array.from(new Set(allTrades.map(t=>t.strategy).filter(Boolean)))];

  const filtered = allTrades.filter(t => {
    const sym = (t.instrument||t.symbol||"").replace("MCX:","");
    if (filterSym    && !sym.toLowerCase().includes(filterSym.toLowerCase())) return false;
    if (filterStrat  !== "all" && t.strategy !== filterStrat)  return false;
    if (filterStatus !== "all" && t.status   !== filterStatus) return false;
    if (filterDate   && (t.entry_time||"").slice(0,10) !== filterDate) return false;
    return true;
  });

  const closedF    = filtered.filter(t => t.status === "CLOSED");
  const openF      = filtered.filter(t => t.status === "OPEN");
  const winnersF   = closedF.filter(t => (t.pnl_r||0) > 0);
  const winRateF   = closedF.length ? Math.round(winnersF.length / closedF.length * 100) : null;
  const avgRF      = closedF.length ? closedF.reduce((s,t)=>s+(t.pnl_r||0),0)/closedF.length : null;
  const totalRF    = closedF.reduce((s,t)=>s+(t.pnl_r||0), 0);
  const closedPnlInr = closedF.reduce((s,t)=>s+(t.pnl_approx||0), 0);
  const openPnlInr   = openF.reduce((s,t) => {
    const ltp       = ltps ? (ltps[t.instrument]?.ltp||null) : null;
    const spotEntry = t.spot_at_entry || 0;
    const spotMove  = ltp != null ? (t.direction==="LONG" ? ltp - spotEntry : spotEntry - ltp) : null;
    const estPnlLot = spotMove != null ? round2(round2(spotMove * 0.35) * (t.lot_size||1) * (t.lots||1)) : 0;
    return s + estPnlLot;
  }, 0);
  const totalPnlInr = closedPnlInr + openPnlInr;
  const isFiltered = !!(filterSym || filterStrat!=="all" || filterStatus!=="all" || filterDate);

  const inputStyle = {
    background:"#0f1623", border:"1px solid #1e2433", borderRadius:4,
    color:"#e2e8f0", padding:"3px 7px", fontSize:11
  };

  function OptionsChainView() {
    const SYMS = ["CRUDEOIL","GOLD","SILVER","COPPER","NATURALGAS","SILVERMICRO","COPPERMINI"];
    const chain = commChain;

    function fetchChain(sym, idx) {
      setCommChainBusy(true);
      fetch(`${API}/commodity/chain-full/${sym}?expiry_idx=${idx}`)
        .then(r => r.json())
        .then(d => { setCommChain(d); setCommChainBusy(false); })
        .catch(() => setCommChainBusy(false));
    }

    return (
      <div style={{display:"flex",gap:12,alignItems:"flex-start"}}>
        <div style={{flexShrink:0,width:130,background:"#0f1623",border:"1px solid #1e2433",borderRadius:8,overflow:"hidden"}}>
          <div style={{fontSize:9,color:"#64748b",textTransform:"uppercase",letterSpacing:".08em",padding:"8px 12px 6px",borderBottom:"1px solid #1e2433"}}>Commodity</div>
          {SYMS.map(s => (
            <div key={s}
              onClick={() => { setCommChainSym(s); setCommChainExpIdx(0); setCommChain(null); fetchChain(s, 0); }}
              style={{padding:"9px 12px",cursor:"pointer",fontSize:12,fontFamily:"monospace",
                background: commChainSym===s ? "#1e3a5f" : "transparent",
                color: commChainSym===s ? "#93c5fd" : "#64748b",
                borderLeft: commChainSym===s ? "2px solid #3b82f6" : "2px solid transparent",
                transition:"all .1s"
              }}>
              {s}
            </div>
          ))}
        </div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{display:"flex",flexWrap:"wrap",gap:12,marginBottom:14,alignItems:"center"}}>
            {chain?.expiries?.length > 1 && (
              <div style={{display:"flex",alignItems:"center",gap:6}}>
                <span style={{fontSize:10,color:"#94a3b8",textTransform:"uppercase",letterSpacing:".06em"}}>Expiry</span>
                <select value={commChainExpIdx}
                  onChange={e => { const i=Number(e.target.value); setCommChainExpIdx(i); fetchChain(commChainSym,i); }}
                  style={{background:"#0f1623",border:"1px solid #1e2433",borderRadius:4,color:"#e2e8f0",padding:"3px 7px",fontSize:11,colorScheme:"dark"}}>
                  {chain.expiries.map((exp,i) => <option key={exp} value={i}>{exp}</option>)}
                </select>
              </div>
            )}
            <button className="mode-btn" style={{marginLeft:"auto"}}
              onClick={() => fetchChain(commChainSym, commChainExpIdx)}>
              ↻ Refresh
            </button>
          </div>
          {chain && (
            <div style={{display:"flex",gap:14,marginBottom:12,fontSize:11,flexWrap:"wrap",alignItems:"center",padding:"8px 12px",background:"#151a28",borderRadius:8,border:"1px solid #1e2433"}}>
              <span style={{color:"#94a3b8"}}>Spot</span>
              <span style={{fontFamily:"monospace",fontWeight:700,color:"#f1f5f9",fontSize:16}}>
                {chain.spot ? chain.spot.toLocaleString("en-IN",{maximumFractionDigits:2}) : "—"}
              </span>
              <span style={{color:"#94a3b8",marginLeft:6}}>ATM</span>
              <span style={{fontFamily:"monospace",fontWeight:600,color:"#f59e0b"}}>
                {chain.atm_strike ? chain.atm_strike.toLocaleString("en-IN") : "—"}
              </span>
              {chain.source && (
                <span style={{marginLeft:"auto",fontSize:9,color:"#64748b",fontStyle:"italic"}}>
                  {chain.source==="live_chain" ? "● live chain" : "◌ bs estimate"}
                </span>
              )}
            </div>
          )}
          {commChainBusy && <div className="empty">Loading chain data...</div>}
          {!commChainBusy && !chain && (
            <div className="empty">Select a commodity from the list to load the options chain</div>
          )}
          {!commChainBusy && chain?.strikes?.length > 0 && (
            <div className="chain-wrap">
              <table className="chain-table">
                <thead>
                  <tr>
                    <th style={{color:"#86efac"}}>CE OI</th>
                    <th style={{color:"#86efac"}}>CE Vol</th>
                    <th style={{color:"#86efac"}}>IV%</th>
                    <th style={{color:"#86efac"}}>Δ</th>
                    <th style={{color:"#86efac"}}>θ</th>
                    <th style={{color:"#86efac",fontSize:11}}>LTP</th>
                    <th className="ctr" style={{color:"#94a3b8",minWidth:72}}>Strike</th>
                    <th style={{textAlign:"left",color:"#fca5a5",fontSize:11}}>LTP</th>
                    <th style={{textAlign:"left",color:"#fca5a5"}}>θ</th>
                    <th style={{textAlign:"left",color:"#fca5a5"}}>Δ</th>
                    <th style={{textAlign:"left",color:"#fca5a5"}}>IV%</th>
                    <th style={{textAlign:"left",color:"#fca5a5"}}>PE Vol</th>
                    <th style={{textAlign:"left",color:"#fca5a5"}}>PE OI</th>
                  </tr>
                </thead>
                <tbody>
                  {chain.strikes.map(row => {
                    const atm = row.is_atm;
                    return (
                      <tr key={row.strike} className={atm?"atm":""}>
                        <td style={{color:row.ce_oi>0?"#94a3b8":"#334155"}}>{row.ce_oi>0?row.ce_oi.toLocaleString("en-IN"):"—"}</td>
                        <td style={{color:row.ce_vol>0?"#94a3b8":"#334155"}}>{row.ce_vol>0?row.ce_vol.toLocaleString("en-IN"):"—"}</td>
                        <td style={{color:row.ce_iv>0?"#94a3b8":"#334155"}}>{row.ce_iv>0?row.ce_iv.toFixed(1)+"%":"—"}</td>
                        <td style={{color:"#86efac"}}>{row.ce_delta.toFixed(3)}</td>
                        <td style={{color:"#f59e0b"}}>{row.ce_theta.toFixed(2)}</td>
                        <td style={{fontWeight:700,color:"#86efac",fontSize:12}}>{row.ce_ltp>0?row.ce_ltp.toFixed(2):"—"}</td>
                        <td className="ctr">
                          {Number.isInteger(row.strike) ? row.strike : row.strike.toFixed(0)}
                          {atm && <span style={{fontSize:7,color:"#60a5fa",marginLeft:3,verticalAlign:"middle",letterSpacing:0}}>▲ATM</span>}
                        </td>
                        <td style={{textAlign:"left",fontWeight:700,color:"#fca5a5",fontSize:12}}>{row.pe_ltp>0?row.pe_ltp.toFixed(2):"—"}</td>
                        <td style={{textAlign:"left",color:"#f59e0b"}}>{row.pe_theta.toFixed(2)}</td>
                        <td style={{textAlign:"left",color:"#fca5a5"}}>{row.pe_delta.toFixed(3)}</td>
                        <td style={{textAlign:"left",color:row.pe_iv>0?"#94a3b8":"#334155"}}>{row.pe_iv>0?row.pe_iv.toFixed(1)+"%":"—"}</td>
                        <td style={{textAlign:"left",color:row.pe_vol>0?"#94a3b8":"#334155"}}>{row.pe_vol>0?row.pe_vol.toLocaleString("en-IN"):"—"}</td>
                        <td style={{textAlign:"left",color:row.pe_oi>0?"#94a3b8":"#334155"}}>{row.pe_oi>0?row.pe_oi.toLocaleString("en-IN"):"—"}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}
          {!commChainBusy && chain && chain.strikes?.length === 0 && (
            <div className="empty">
              {chain.source==="bs_estimate" && !chain.spot
                ? "No spot price available. Start the bot during MCX hours (09:00–23:30 IST)."
                : "No strikes returned from chain."}
            </div>
          )}
        </div>
      </div>
    );
  }

  const isReal = commMode === "REAL";

  return (
    <div>
      {/* Mode banner + toggle */}
      <div style={{
        background: isReal ? "#0d2318" : "#0d1f35",
        border: `1px solid ${isReal ? "#15803d44" : "#1e3a5f44"}`,
