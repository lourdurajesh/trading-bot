        borderRadius:8, padding:"10px 14px", marginBottom:14,
        display:"flex", alignItems:"center", gap:12, fontSize:12,
      }}>
        <span style={{color: isReal ? "#86efac" : "#93c5fd", flex:1}}>
          {isReal
            ? <><strong style={{color:"#4ade80"}}>REAL TRADING</strong> — MCX commodity options · Live broker orders via Fyers · TrendSpread · RSIReversalSpread · BreakoutSpread</>
            : <><strong>PAPER MODE</strong> — MCX commodity options · TrendSpread · RSIReversalSpread · BreakoutSpread · Live chain + Black-Scholes fallback · 09:00–23:30 IST</>
          }
        </span>
        <button
          className="mode-btn"
          disabled={commModeBusy}
          onClick={onModeToggle}
          style={{
            background: isReal ? "#14532d" : "#1e3a5f",
            borderColor: isReal ? "#15803d" : "#1e40af",
            color: isReal ? "#86efac" : "#93c5fd",
            minWidth:110, fontWeight:600,
          }}
        >
          {commModeBusy ? "Switching…" : isReal ? "Switch to Paper" : "Switch to Real"}
        </button>
      </div>

      {/* filter bar */}
      <div style={{display:"flex",flexWrap:"wrap",gap:8,marginBottom:12,alignItems:"center"}}>
        <input type="text" placeholder="Instrument…" value={filterSym}
          onChange={e=>setFilterSym(e.target.value)} style={{...inputStyle,width:120}}/>
        <select value={filterStrat} onChange={e=>setFilterStrat(e.target.value)} style={inputStyle}>
          {strategies.map(s=><option key={s} value={s}>{s==="all"?"All strategies":s}</option>)}
        </select>
        <select value={filterStatus} onChange={e=>setFilterStatus(e.target.value)} style={inputStyle}>
          <option value="all">All status</option>
          <option value="OPEN">OPEN</option>
          <option value="CLOSED">CLOSED</option>
        </select>
        <input type="date" value={filterDate} onChange={e=>setFilterDate(e.target.value)}
          style={{...inputStyle,colorScheme:"dark"}}/>
        {isFiltered && (
          <button style={{...inputStyle,cursor:"pointer",color:"#f59e0b"}}
            onClick={()=>{setFilterSym("");setFilterStrat("all");setFilterStatus("all");setFilterDate("");}}>
            ✕ Clear
          </button>
        )}
        <span style={{marginLeft:"auto",color:"#64748b",fontSize:11}}>
          {isFiltered ? `${filtered.length} / ${allTrades.length} rows` : `${allTrades.length} trades`}
        </span>
      </div>

      {/* stats widgets — live from filtered rows */}
      <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:10,marginBottom:16}}>
        <div className="metric">
          <div className="lbl">Closed{isFiltered?" · filtered":""}</div>
          <div className="val neutral">{closedF.length}</div>
        </div>
        <div className="metric">
          <div className="lbl">Open now</div>
          <div className="val neutral">{openF.length}</div>
        </div>
        <div className="metric">
          <div className="lbl">Win rate</div>
          <div className={`val ${(winRateF||0)>=50?"up":"down"}`}>{winRateF!==null?winRateF+"%":"—"}</div>
        </div>
        <div className="metric">
          <div className="lbl">Total R</div>
          <div className={`val ${totalRF>=0?"up":"down"}`}>{closedF.length?`${totalRF>=0?"+":""}${totalRF.toFixed(1)}R`:"—"}</div>
        </div>
        <div className="metric">
          <div className="lbl">Overall P&L{openF.length>0?" (incl. live)":""}</div>
          <div className={`val ${totalPnlInr>=0?"up":"down"}`}>
            {(closedF.length||openF.length)?`${totalPnlInr>=0?"+":""}₹${Math.abs(totalPnlInr).toFixed(0)}`:"—"}
          </div>
        </div>
      </div>

      {/* by-strategy P&L attribution — all-time from server; hidden when filter active */}
      {commStats?.by_strategy && Object.keys(commStats.by_strategy).length > 0 && !isFiltered && (
        <div className="card" style={{marginBottom:16}}>
          <h2>Strategy P&L attribution
            <span style={{marginLeft:8,fontWeight:400,color:"#64748b",fontSize:10,textTransform:"none",letterSpacing:0}}>
              identify which strategy is losing
            </span>
          </h2>
          {Object.entries(commStats.by_strategy)
            .filter(([,s])=>s.avg_r<-0.3&&s.total>=3)
            .map(([strat,s])=>(
              <div key={strat} style={{background:"#1c0a0a",border:"1px solid #7f1d1d",borderRadius:6,padding:"8px 12px",marginBottom:8,fontSize:11,color:"#fca5a5"}}>
                ⚠ <strong>{strat}</strong> is losing — avg {s.avg_r}R across {s.total} trades ({s.win_rate}% win rate). Review entry conditions or disable.
              </div>
          ))}
          <table className="data-table">
            <thead>
              <tr><th>Strategy</th><th>Trades</th><th>Win %</th><th>Avg R</th><th>Total R</th><th>Best</th><th>Worst</th></tr>
            </thead>
            <tbody>
              {Object.entries(commStats.by_strategy).sort((a,b)=>b[1].total-a[1].total).map(([strat,s])=>(
                <tr key={strat}>
                  <td><StratBadge name={strat}/></td>
                  <td>{s.total}</td>
                  <td className={s.win_rate>=50?"good":"bad"}>{s.win_rate}%</td>
                  <td className={s.avg_r>=0?"good":"bad"} style={{fontFamily:"monospace",fontWeight:600}}>{s.avg_r>=0?"+":""}{s.avg_r}R</td>
                  <td className={s.total_r>=0?"good":"bad"} style={{fontFamily:"monospace"}}>{s.total_r>=0?"+":""}{s.total_r}R</td>
                  <td className="good" style={{fontFamily:"monospace",fontSize:10}}>+{s.best_r}R</td>
                  <td className="bad" style={{fontFamily:"monospace",fontSize:10}}>{s.worst_r}R</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {/* per-instrument breakdown — all-time; hidden when filter active */}
      {commStats?.by_instrument && Object.keys(commStats.by_instrument).length > 0 && !isFiltered && (
        <div className="card" style={{marginBottom:16}}>
          <h2>By instrument</h2>
          <table className="data-table">
            <thead>
              <tr><th>Instrument</th><th>Trades</th><th>Win %</th><th>Avg R</th><th>Total R</th><th>Wins</th></tr>
            </thead>
            <tbody>
              {Object.entries(commStats.by_instrument).sort((a,b)=>b[1].total-a[1].total).map(([ins,s])=>(
                <tr key={ins}>
                  <td className="sym">{ins.replace("MCX:","")}</td>
                  <td>{s.total}</td>
                  <td className={s.win_rate>=50?"good":"bad"}>{s.win_rate}%</td>
                  <td className={s.avg_r>=0?"good":"bad"} style={{fontFamily:"monospace"}}>{s.avg_r>=0?"+":""}{s.avg_r}R</td>
                  <td className={s.total_r>=0?"good":"bad"} style={{fontFamily:"monospace",fontSize:10}}>{s.total_r>=0?"+":""}{(s.total_r||0).toFixed(1)}R</td>
                  <td className="neutral-cell">{s.wins}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {/* data source note */}
      {commStats?.data_sources && !isFiltered && (
        <div style={{display:"flex",gap:16,marginBottom:12,fontSize:11}}>
          {commStats.data_sources.live_chain && <span><span className="source-live">●</span> Live chain: {commStats.data_sources.live_chain} trades</span>}
          {commStats.data_sources.black_scholes && <span><span className="source-sim">◌</span> Black-Scholes sim: {commStats.data_sources.black_scholes} trades</span>}
        </div>
      )}

      {/* sub-tabs */}
      <div className="sub-tabs">
        {[["trades","All Trades"],["open","Open Positions"],["exits","Exit Breakdown"],["instruments","Instruments"],["chain","Options Chain"]].map(([id,lbl])=>(
          <button key={id} className={`sub-tab ${subTab===id?"active":""}`} onClick={()=>setSubTab(id)}>{lbl}</button>
        ))}
      </div>

      {subTab==="trades" && (
        <div className="card">
          <h2>
            Trades
            {isFiltered && <span style={{marginLeft:6,fontWeight:400,color:"#f59e0b",fontSize:10,textTransform:"none",letterSpacing:0}}>· filter active</span>}
          </h2>
          <CommodityTradesTable trades={filtered} ltps={ltps} onManualClose={onManualClose} mcxConfig={mcxConfig}/>
        </div>
      )}

      {subTab==="open" && (
        <div className="card">
          <h2>Open positions ({openF.length})</h2>
          {openF.length ? (
            <CommodityTradesTable trades={openF} ltps={ltps} onManualClose={onManualClose} mcxConfig={mcxConfig}/>
          ) : <div className="empty">No open commodity option positions</div>}
        </div>
      )}

      {subTab==="exits" && (
        <div className="grid2">
          <div className="card">
            <h2>Exit reasons</h2>
            {commStats?.exit_reasons ? Object.entries(commStats.exit_reasons).sort((a,b)=>b[1]-a[1]).map(([r,n])=>(
              <div key={r} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid #111827",fontSize:12}}>
                <span style={{color:"#94a3b8"}}>{r}</span>
                <span className={r==="TARGET_50PCT"?"up":r.includes("LOSS")||r==="STOP_60PCT"||r==="EOD_MCX"||r==="FALSE_BREAKOUT"?"down":"neutral"}>{n}</span>
              </div>
            )) : <div className="empty">No data</div>}
          </div>
          <div className="card">
            <h2>P&L summary</h2>
            {commStats?.total_closed>0 && (
              <div style={{display:"grid",gap:8}}>
                {[["Avg R", `${(commStats.avg_r||0)>=0?"+":""}${(commStats.avg_r||0).toFixed(2)}R`, (commStats.avg_r||0)>=0?"up":"down"],
                  ["Best trade", `+${commStats.best_trade_r||0}R`, "up"],
                  ["Worst trade", `${commStats.worst_trade_r||0}R`, "down"],
                  ["Total R", `${(commStats.total_r||0)>=0?"+":""}${(commStats.total_r||0).toFixed(1)}R`, (commStats.total_r||0)>=0?"up":"down"],
                ].map(([lbl,val,cls])=>(
                  <div key={lbl} style={{display:"flex",justifyContent:"space-between",fontSize:12}}>
                    <span style={{color:"#94a3b8"}}>{lbl}</span>
                    <span className={cls} style={{fontFamily:"monospace"}}>{val}</span>
                  </div>
                ))}
              </div>
            )}
            {!commStats?.total_closed && <div className="empty">No closed trades yet</div>}
          </div>
        </div>
      )}

      {subTab==="instruments" && (
        <InstrumentsPanel
          instruments={instruments}
          trades={trades}
          instrBusy={instrBusy}
          setInstrBusy={setInstrBusy}
          setInstruments={setInstruments}
        />
      )}

      {subTab==="chain" && (
        <div className="card">
          <h2>Live Options Chain
            <span style={{marginLeft:8,fontWeight:400,color:"#64748b",fontSize:10,textTransform:"none",letterSpacing:0}}>
              CE (calls) ← Strike → PE (puts) · Green=CE · Red=PE · Blue highlight=ATM
            </span>
          </h2>
          <OptionsChainView/>
        </div>
      )}
    </div>
  );
}

// ── Strategy Config components ───────────────────────────────────────────

function CooldownHoursInput({ value, onChange }) {
  const [editing, setEditing] = React.useState(false);
  const [val, setVal] = React.useState(String(value));
  React.useEffect(() => { setVal(String(value)); }, [value]);
  const commit = () => {
    setEditing(false);
    const n = parseInt(val, 10);
    if (!isNaN(n) && n >= 1 && n <= 24) onChange(n);
    else setVal(String(value));
  };
  return (
    <div style={{display:"flex",alignItems:"center",gap:6,fontSize:11}}>
      <span style={{color:"#94a3b8"}}>Duration:</span>
      {editing ? (
        <input type="number" value={val}
          onChange={e=>setVal(e.target.value)} onBlur={commit}
          onKeyDown={e=>{if(e.key==="Enter")commit();if(e.key==="Escape"){setEditing(false);setVal(String(value));}}}
          autoFocus min={1} max={24}
          style={{width:56,background:"#1e293b",color:"#f1f5f9",border:"1px solid #3b82f6",
                  borderRadius:3,padding:"2px 6px",fontSize:11,textAlign:"center"}}
        />
      ) : (
        <button onClick={()=>setEditing(true)}
          style={{background:"#1e293b",color:"#f1f5f9",border:"1px solid #334155",
                  borderRadius:3,padding:"2px 10px",fontSize:11,cursor:"pointer",fontFamily:"monospace"}}>
          {value}h
        </button>
      )}
    </div>
  );
}

/* Editable percentage field for SL/Target params */
function PctParamField({ strategy, param, value, label, desc, onUpdate }) {
  const [editing, setEditing] = React.useState(false);
  const pctVal = Math.round((value || 0) * 100);
  const [raw, setRaw] = React.useState(String(pctVal));
  React.useEffect(() => { setRaw(String(Math.round((value || 0) * 100))); }, [value]);
  const commit = () => {
    setEditing(false);
    const n = parseInt(raw, 10);
    if (!isNaN(n) && n > 0 && n <= 200) onUpdate(strategy, param, parseFloat((n / 100).toFixed(2)));
    else setRaw(String(Math.round((value || 0) * 100)));
  };
  return (
    <div style={{background:"#0f172a",borderRadius:6,padding:"8px 12px",border:"1px solid #1e293b",minWidth:160}}>
      <div style={{fontSize:9,color:"#64748b",marginBottom:3}}>{label}</div>
      <div style={{display:"flex",alignItems:"center",gap:6}}>
        {editing ? (
          <><input type="number" value={raw} onChange={e=>setRaw(e.target.value)} onBlur={commit}
              onKeyDown={e=>{if(e.key==="Enter")commit();if(e.key==="Escape"){setEditing(false);setRaw(String(Math.round((value||0)*100)));}}}
              autoFocus min={1} max={200} style={{width:56,background:"#1e293b",color:"#f1f5f9",
              border:"1px solid #3b82f6",borderRadius:3,padding:"2px 6px",fontSize:11,textAlign:"center"}}/>
            <span style={{fontSize:11,color:"#94a3b8"}}>%</span></>
        ) : (
          <button onClick={()=>setEditing(true)} style={{background:"#1e293b",color:"#f1f5f9",border:"1px solid #334155",
              borderRadius:3,padding:"2px 10px",fontSize:11,cursor:"pointer",fontFamily:"monospace"}}>
            {pctVal}%
          </button>
        )}
        <span style={{fontSize:9,color:"#334155"}}>{desc}</span>
      </div>
    </div>
  );
}

/* Editable multiplier field (e.g., target_upgrade_mult = 2.0×) */
function MultParamField({ strategy, param, value, label, desc, onUpdate }) {
  const [editing, setEditing] = React.useState(false);
  const [raw, setRaw] = React.useState(String(value));
  React.useEffect(() => { setRaw(String(value)); }, [value]);
  const commit = () => {
    setEditing(false);
    const n = parseFloat(raw);
    if (!isNaN(n) && n > 0) onUpdate(strategy, param, n);
    else setRaw(String(value));
  };
  return (
    <div style={{background:"#0f172a",borderRadius:6,padding:"8px 12px",border:"1px solid #1e293b",minWidth:160}}>
      <div style={{fontSize:9,color:"#64748b",marginBottom:3}}>{label}</div>
      <div style={{display:"flex",alignItems:"center",gap:6}}>
        {editing ? (
          <><input type="number" step="0.1" value={raw} onChange={e=>setRaw(e.target.value)} onBlur={commit}
              onKeyDown={e=>{if(e.key==="Enter")commit();if(e.key==="Escape"){setEditing(false);setRaw(String(value));}}}
              autoFocus min={0.5} style={{width:56,background:"#1e293b",color:"#f1f5f9",
              border:"1px solid #3b82f6",borderRadius:3,padding:"2px 6px",fontSize:11,textAlign:"center"}}/>
            <span style={{fontSize:11,color:"#94a3b8"}}>×</span></>
        ) : (
          <button onClick={()=>setEditing(true)} style={{background:"#1e293b",color:"#f1f5f9",border:"1px solid #334155",
              borderRadius:3,padding:"2px 10px",fontSize:11,cursor:"pointer",fontFamily:"monospace"}}>
            {value}×
          </button>
        )}
        <span style={{fontSize:9,color:"#334155"}}>{desc}</span>
      </div>
    </div>
  );
}

function McxConfigPage({ config, onUpdate, onRefresh }) {
  if (!config) return <div className="empty">Loading MCX strategy config...</div>;
  const { strategies = {}, cooldowns = {} } = config;
  const sorted = Object.entries(strategies).sort(([,a],[,b]) => a.priority - b.priority);
  const RISK_BG = { HIGH:"#1f0505", MEDIUM:"#2d2200", LOW:"#0d2218" };
  const RISK_BC = { HIGH:"#ef444444", MEDIUM:"#f59e0b44", LOW:"#16653444" };

  const updateParam = (strat, param, value) => {
    fetch(`${API}/commodity/config/${strat}/${param}`, {
      method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({value}),
    }).then(r=>r.json()).then(d=>{
      if (d.ok) onUpdate(strat, param, value);
      else alert(`Update failed: ${d.error}`);
    }).catch(e=>alert(`Request error: ${e}`));
  };

  const clearCooldown = (instrument) => {
    fetch(`${API}/commodity/cooldown/${instrument}`, {method:"DELETE"})
      .then(r=>r.json())
      .then(d=>{ if(d.ok) onRefresh(); else alert(`Clear failed: ${d.error}`); })
      .catch(e=>alert(`Request error: ${e}`));
  };

  return (
    <div>
      <div style={{color:"#94a3b8",fontSize:11,marginBottom:16}}>
        Strategies are evaluated in priority order — first match wins. Risk reflects historical false-signal rate.
        Cooldown blocks re-entry on an instrument after a bad exit.
        All changes are saved to disk and survive bot restarts — they apply on the next MCX cycle.
      </div>

      <div style={{display:"grid",gap:10}}>
        {sorted.map(([key, cfg]) => {
          const rc = cfg.risk_color || "#94a3b8";
          const riskBg = RISK_BG[cfg.risk] || "#151a28";
          const riskBc = RISK_BC[cfg.risk] || "#33415544";
          return (
            <div key={key} style={{background:riskBg,border:`1px solid ${riskBc}`,borderRadius:10,padding:"14px 16px"}}>
              <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",marginBottom:10}}>
                <span style={{background:"#1e293b",border:"1px solid #334155",color:"#64748b",
                              borderRadius:4,padding:"2px 8px",fontSize:10,fontWeight:700,fontFamily:"monospace"}}>
                  #{cfg.priority}
                </span>
                <span style={{fontWeight:600,fontSize:13,color:"#f1f5f9"}}>{key}</span>
                <span style={{background:rc+"22",color:rc,border:`1px solid ${rc}44`,
                              borderRadius:3,padding:"2px 8px",fontSize:10,fontWeight:700}}>
                  {cfg.risk==="HIGH" ? "⚠ HIGH RISK" : `● ${cfg.risk} RISK`}
                </span>
                <span style={{color:"#94a3b8",fontSize:10,flex:1,minWidth:120}}>{cfg.risk_label}</span>
              </div>
              <div style={{display:"flex",alignItems:"center",gap:16,background:"#0f172a",borderRadius:6,padding:"10px 14px",flexWrap:"wrap"}}>
                <span style={{fontSize:11,color:"#94a3b8",fontWeight:500}}>Cooldown after bad exit:</span>
                <label style={{cursor:"pointer",display:"flex",alignItems:"center",gap:6,fontSize:11}}>
                  <input type="checkbox" checked={cfg.cooldown_enabled}
                    onChange={e=>updateParam(key,"cooldown_enabled",e.target.checked)}
                    style={{cursor:"pointer"}}/>
                  {cfg.cooldown_enabled
                    ? <span style={{color:"#22c55e"}}>Enabled</span>
                    : <span style={{color:"#ef4444"}}>Disabled</span>}
                </label>
                {cfg.cooldown_enabled && (
                  <CooldownHoursInput value={cfg.cooldown_hours}
                    onChange={v=>updateParam(key,"cooldown_hours",v)}/>
                )}
              </div>

              {/* SL / Trailing / Target config */}
              <div style={{marginTop:8}}>
                <div style={{fontSize:10,color:"#64748b",marginBottom:6,fontWeight:600,letterSpacing:"0.05em",textTransform:"uppercase"}}>
                  Stop-Loss &amp; Target
                  <span style={{marginLeft:8,fontSize:9,color:"#334155",textTransform:"none",fontWeight:400}}>
                    SL distance = (% × net_debit) ÷ 0.35 — scales with what you paid, not a blind % of spot
                  </span>
                </div>
                <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(175px,1fr))",gap:6}}>
                  <PctParamField strategy={key} param="sl_debit_pct"
                    value={cfg.sl_debit_pct} label="Initial SL"
                    desc="of debit → stop loss" onUpdate={updateParam}/>
                  <PctParamField strategy={key} param="trail_trigger_pct"
                    value={cfg.trail_trigger_pct} label="Trail activates after"
                    desc="of debit gained" onUpdate={updateParam}/>
                  <PctParamField strategy={key} param="trail_debit_pct"
                    value={cfg.trail_debit_pct} label="Trail distance"
                    desc="of debit below peak" onUpdate={updateParam}/>
                  <PctParamField strategy={key} param="target_pct"
                    value={cfg.target_pct} label="Initial target"
                    desc="of max profit" onUpdate={updateParam}/>
                  <PctParamField strategy={key} param="target_upgraded_pct"
                    value={cfg.target_upgraded_pct} label="Upgraded target"
                    desc="of max profit on momentum" onUpdate={updateParam}/>
                  <MultParamField strategy={key} param="target_upgrade_mult"
                    value={cfg.target_upgrade_mult} label="Upgrade trigger"
                    desc="× SL distance favorable" onUpdate={updateParam}/>
                </div>
              </div>
            </div>
          );
        })}
      </div>

      {/* Active cooldowns */}
      <div className="card" style={{marginTop:16}}>
        <h2 style={{marginBottom:10}}>Active Entry Cooldowns</h2>
        {Object.keys(cooldowns).length === 0 ? (
          <div style={{color:"#64748b",fontSize:11}}>No active cooldowns — all instruments available for entry.</div>
        ) : (
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            {Object.entries(cooldowns).map(([instr, cd]) => (
              <div key={instr} style={{display:"flex",alignItems:"center",gap:10,
                background:"#1a0a00",borderRadius:6,padding:"8px 14px",
                border:"1px solid #f9731644",flexWrap:"wrap"}}>
                <span style={{fontSize:13,color:"#f59e0b",fontWeight:700,fontFamily:"monospace"}}>{instr}</span>
                <span style={{fontSize:11,color:"#f97316"}}>⏳ {cd.remaining_min}min remaining</span>
                <span style={{fontSize:10,color:"#94a3b8",flex:1}}>resumes {cd.resume_at.substring(11,16)} IST</span>
                <button onClick={()=>clearCooldown(instr)}
                  style={{background:"transparent",border:"1px solid #334155",color:"#94a3b8",
                          borderRadius:3,fontSize:10,padding:"2px 8px",cursor:"pointer"}}>
                  Clear
                </button>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

function ParamField({ strategy, param, entry, onUpdate }) {
  const [editing, setEditing] = React.useState(false);
  const [val, setVal] = React.useState(String(entry.value));

  React.useEffect(() => { setVal(String(entry.value)); }, [entry.value]);

  const commit = () => {
    setEditing(false);
    const parsed = entry.type === "float" ? parseFloat(val) : parseInt(val, 10);
    if (!isNaN(parsed)) onUpdate(strategy, param, parsed);
    else setVal(String(entry.value));
  };

  return (
    <div style={{background:"#0f172a",borderRadius:6,padding:"8px 12px",border:"1px solid #1e293b"}}>
      <div style={{fontSize:10,color:"#94a3b8",marginBottom:4}}>{entry.description || param}</div>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        <code style={{fontSize:11,color:"#94a3b8",flex:1}}>{param}</code>
        {editing ? (
          <input type="number" value={val}
            onChange={e=>setVal(e.target.value)} onBlur={commit}
            onKeyDown={e=>{if(e.key==="Enter")commit();if(e.key==="Escape"){setEditing(false);setVal(String(entry.value));}}}
            autoFocus
            style={{width:80,background:"#1e293b",color:"#f1f5f9",border:"1px solid #3b82f6",
              borderRadius:3,padding:"2px 6px",fontSize:12,textAlign:"right"}}
            step={entry.type==="float"?"0.1":"1"} min={entry.min} max={entry.max}
          />
        ) : (
          <button onClick={()=>setEditing(true)}
            style={{background:"#1e293b",color:"#f1f5f9",border:"1px solid #334155",
              borderRadius:3,padding:"2px 10px",fontSize:12,cursor:"pointer",fontFamily:"monospace"}}>
            {entry.value}
          </button>
        )}
      </div>
      {entry.min!==undefined && (
        <div style={{fontSize:9,color:"#64748b",marginTop:2}}>range: {entry.min} – {entry.max}</div>
      )}
    </div>
  );
}

function StrategyConfigPage({ config, onUpdate }) {

  const LABELS = {
    trend_follow:           "TrendFollow — LONG Breakout",
    short_trend:            "ShortTrend — SHORT Breakdown",
    mean_reversion:         "MeanReversion — Range Bounce",
    institutional_momentum: "InstitutionalMomentum — ATM Options (conviction days)",
    directional_options:    "DirectionalOptions — Debit Spread",
    options_income:         "OptionsIncome — Premium Collection",
    iron_condor:            "IronCondor — 4-Leg Range",
    gap_fade:               "GapFade — Gap Reversal at Open",
    momentum_reversal:      "MomentumReversal — Extreme RSI Fade",
  };

  const updateParam = (strat, param, value) => {
    fetch(`${API}/config/strategies/${strat}/${param}`, {
      method:"POST",

      body: JSON.stringify({value}),

    .then(r=>r.json())
    .then(d=>{
      if (d.ok) onUpdate(strat, param, value);

  return (
    <div>
      <div style={{color:"#94a3b8",fontSize:11,marginBottom:16}}>

        Click a value to edit it; press Enter or click away to apply.
      </div>
      <div style={{display:"grid",gap:14}}>
        {Object.entries(config).map(([key, params]) => {

          return (
            <div key={key} className="card" style={{opacity:isEnabled?1:0.55}}>
              <h2 style={{display:"flex",alignItems:"center",gap:12,flexWrap:"wrap"}}>
                <span>{LABELS[key]||key}</span>
                <label style={{cursor:"pointer",display:"flex",alignItems:"center",gap:5,fontSize:11,fontWeight:400,marginLeft:"auto"}}>
                  <input type="checkbox" checked={isEnabled}
                    onChange={e=>updateParam(key,"enabled",e.target.checked)}
                    style={{cursor:"pointer"}} />
                  {isEnabled
                    ? <span style={{color:"#22c55e"}}>Enabled</span>
                    : <span style={{color:"#ef4444"}}>Disabled</span>}

              </h2>
              <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(270px,1fr))",gap:8,marginTop:8}}>
                {Object.entries(params)
